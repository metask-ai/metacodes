model: metacodes-w05-mock
harness: metacodes/0.1.0
dataset: datasets/metacodes-w05-synthetic/tasks
harness_backend: local
model_connection: local_proxy
jobs_dir: results/metacodes-w05-real-control
n_attempts: 1
record_full_io: true
agent_user: dev
verifier_user: dev
extra_allowed_hosts:
  - host.docker.internal
harness_params_override:
  METACODES_PROJECT_CONTROL_MODE: enforced
  METACODES_PROJECT_RULES_RELATIVE: share/metacodes/workbuddy-w05/project-rules
  METACODES_PROJECT_KERNEL_RELATIVE: libexec/metacodes-project-kernel
task_selection:
  mode: name
  names: [metacodes-w05-control]
orchestrator_override:
  n_concurrent_trials: 1
context_window: 200000
context_compact_pct: 92
