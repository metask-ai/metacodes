<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MetaCodes · Bench Profiles</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" defer></script>
</head>
<body>
  <aside class="rail" aria-label="主导航">
    <a class="mark" href="#/" title="Bench Profiles" aria-label="Profiles">MC</a>
    <nav>
      <a href="#/" data-nav="overview" title="Profiles" aria-label="Profiles"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Profiles</span></a>
      <a href="#/leaderboard" data-nav="leaderboard" title="公开榜单" aria-label="公开榜单"><svg viewBox="0 0 24 24"><path d="M4 20V12h4v8M10 20V4h4v16M16 20v-6h4v6"/></svg><span>榜单</span></a>
      <a href="#/monitor" data-nav="monitor" title="监控" aria-label="监控"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>监控</span></a>
      <a href="#/settings" data-nav="settings" title="系统配置" aria-label="系统配置"><svg viewBox="0 0 24 24"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Zm0 0v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>系统配置</span></a>
    </nav>
  </aside>
  <main class="canvas">
    <header class="header">
      <div>
        <div class="brand">MetaCodes <span>/ Harbor 评测</span></div>
        <h1 id="title">Bench Profiles</h1>
        <div id="crumbs" class="crumbs"></div>
      </div>
      <div class="header-actions">
        <button id="create-run" class="button primary" type="button" hidden>创建作业</button>
        <span id="connection" class="connection"><i></i><span>正在连接</span></span>
        <button id="auto" class="button" type="button" aria-pressed="true">自动刷新 <span id="countdown" class="num"></span></button>
        <button id="refresh" class="button" type="button">刷新</button>
      </div>
    </header>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="app" aria-live="polite"><div class="empty">读取中…</div></div>
    <footer>
      <span></span>
      <span id="updated" class="mono"></span>
    </footer>
  </main>
</body>
</html>
