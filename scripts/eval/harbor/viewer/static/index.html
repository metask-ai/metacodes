<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MetaCodes · Bench 看板</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" defer></script>
</head>
<body>
  <aside class="rail" aria-label="主导航">
    <a class="mark" href="#/" title="Bench 看板" aria-label="看板">MC</a>
    <nav>
      <a href="#/" data-nav="overview" title="看板" aria-label="看板"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>看板</span></a>
      <a href="#/new" data-nav="new" title="发起评测" aria-label="发起评测"><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg><span>评测</span></a>
      <a href="#/compare" data-nav="compare" title="对比" aria-label="对比"><svg viewBox="0 0 24 24"><path d="M5 4v16M19 4v16M5 8h6M13 16h6M9 12h6"/></svg><span>对比</span></a>
      <a href="#/leaderboard" data-nav="leaderboard" title="公开榜单" aria-label="公开榜单"><svg viewBox="0 0 24 24"><path d="M4 20V12h4v8M10 20V4h4v16M16 20v-6h4v6"/></svg><span>榜单</span></a>
      <a href="#/providers" data-nav="providers" title="模型 Provider" aria-label="模型 Provider"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5M3 18l9 5 9-5"/></svg><span>模型</span></a>
      <a href="#/settings" data-nav="settings" title="数据库" aria-label="数据库"><svg viewBox="0 0 24 24"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Zm0 0v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>数据库</span></a>
    </nav>
  </aside>
  <main class="canvas">
    <header class="header">
      <div>
        <div class="brand">MetaCodes <span>/ Harbor 评测</span></div>
        <h1 id="title">Bench 看板</h1>
        <div id="crumbs" class="crumbs"></div>
      </div>
      <div class="header-actions">
        <a class="button primary" href="#/new">发起评测</a>
        <span id="connection" class="connection"><i></i><span>正在连接</span></span>
        <button id="auto" class="button" type="button" aria-pressed="true">自动刷新 <span id="countdown" class="num"></span></button>
        <button id="refresh" class="button" type="button">刷新</button>
      </div>
    </header>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="app" aria-live="polite"><div class="empty">读取中…</div></div>
    <footer>
      <span></span>
      <span id="updated" class="mono"></span>
    </footer>
  </main>
</body>
</html>
