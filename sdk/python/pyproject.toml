# Source installs (pip install sdk/python) carry no native library; the package
# then finds one through METACODES_AGENTCORE_LIB or an installed metacodes SDK.
# Platform wheels with the library inside are built by build_wheel.py.
[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "metacodes"
version = "0.13.0"
description = "Embed the metacodes agent runtime (AgentCore C ABI) in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Metask Lab" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/metask-ai/metacodes"

[tool.setuptools.packages.find]
where = ["src"]
