# Service settings. Every key is read somewhere in app/ ... or so we believe.
[core]
instance_name = core-instance_name
listen_port = 313
worker_count = 424
shutdown_grace_s = 821
debug_endpoints = false

[db]
dsn = https://db.internal/dsn
pool_min = 871
pool_max = 873
statement_timeout_ms = 380
read_replica_dsn = https://db.internal/read_replica_dsn
migrate_on_boot = false

[cache]
backend = cache-backend
ttl_s = 560
max_entries = 293
namespace = cache-namespace
warm_keys = home,pricing,status

[mail]
smtp_host = mail-smtp_host
smtp_port = 110
sender = mail-sender
retry_limit = 314
retry_backoff_ms = 806
tls_required = false

[auth]
token_ttl_s = 300
issuer = auth-issuer
audience = auth-audience
jwks_url = https://auth.internal/jwks_url
clock_skew_s = 381

[storage]
bucket = storage-bucket
region = storage-region
prefix = storage-prefix
signed_url_ttl_s = 823
multipart_chunk_mb = 138

[metrics]
namespace = metrics-namespace
flush_interval_s = 830
histogram_buckets = 5,10,25,50,100,250
tags = env=prod,tier=api

[queue]
url = https://queue.internal/url
visibility_s = 416
max_receive = 270
dead_letter_url = https://queue.internal/dead_letter_url
poll_interval_ms = 832

[search]
index_name = search-index_name
shards = 655
replicas = 861
refresh_interval_s = 135

[billing]
currency = billing-currency
tax_rate = 0.0725
invoice_prefix = billing-invoice_prefix

