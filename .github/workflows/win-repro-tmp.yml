# TEMPORARY: reproduce the Windows fixture flake from main@fd8165f1 by looping the
# full offline suite on hosted windows-latest. Delete before the PR is opened.
name: win-repro-tmp
on:
  push:
    branches: [claude/musing-lumiere-cd9e13]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win-repro-${{ github.sha }}
  cancel-in-progress: false
jobs:
  loop:
    name: Windows suite loop (${{ matrix.variant }} ${{ matrix.slot }})
    strategy:
      fail-fast: false
      matrix:
        variant: [original]
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Normalize line endings of the checkout
        shell: cmd
        run: |
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      - name: Restore the original /tmp fixture literals (diagnostics kept)
        if: startsWith(matrix.variant, 'original')
        shell: cmd
        run: git apply --verbose .github/workflows/win-repro-original.patch && git diff --stat
      - name: Install Python development dependencies
        shell: cmd
        run: python -m pip install -r requirements-dev.txt
      - name: Verify native bundle and fresh-store contract
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      - name: Pre-create D:\tmp with a keep file (control variant)
        if: matrix.variant == 'original-keep'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'D:\tmp' | Out-Null
          New-Item -ItemType File -Force 'D:\tmp\.keep' | Out-Null
          Get-ChildItem -Force 'D:\tmp' | Select-Object -ExpandProperty Name
      - name: Loop the full offline suite with a D:\tmp sampler
        shell: pwsh
        run: |
          $failures = 0
          for ($i = 1; $i -le 1; $i++) {
            Write-Host "=== iteration $i === cwd=$(Get-Location) drive-tmp-exists=$(Test-Path 'D:\tmp') temp=$env:TEMP start=$(Get-Date -Format 'HH:mm:ss.fff')"
            $sampler = Start-Job -ScriptBlock {
              $prev = $null
              while ($true) {
                $e = Test-Path 'D:\tmp'
                if ($e -ne $prev) {
                  $names = if ($e) { (Get-ChildItem -Force 'D:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',' } else { '' }
                  "$(Get-Date -Format 'HH:mm:ss.fff') D:\tmp exists=$e contents=[$names]"
                  $prev = $e
                }
                Start-Sleep -Milliseconds 25
              }
            }
            & zig build test --test-timeout 5m *> "suite-$i.log"
            $code = $LASTEXITCODE
            Write-Host "iteration $i exit=$code end=$(Get-Date -Format 'HH:mm:ss.fff')"
            Stop-Job $sampler
            Receive-Job $sampler | ForEach-Object { Write-Host "  sampler: $_" }
            Remove-Job $sampler
            if ($code -ne 0) { $failures++ }
            $lines = Get-Content "suite-$i.log"
            for ($k = 0; $k -lt $lines.Count; $k++) {
              $l = $lines[$k]
              if ($l -match 'status=fail|fixture:|Build Summary|tests passed|steps succeeded') {
                Write-Host $l
                if ($l -match 'status=fail') {
                  $end = [Math]::Min($k + 12, $lines.Count - 1)
                  for ($j = $k + 1; $j -le $end; $j++) { Write-Host "    $($lines[$j])" }
                }
              }
            }
            Get-ChildItem -Force -Filter '.prelude-ran-*' | ForEach-Object { Write-Host "  prelude marker (workspace): $($_.Name)" }
            Write-Host "  C:\tmp exists=$(Test-Path 'C:\tmp') contents=[$((Get-ChildItem -Force 'C:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')]"
            foreach ($root in @('D:\', 'C:\tmp', 'C:\Users\runneradmin', "$env:TEMP")) {
              Get-ChildItem -Path $root -Force -Recurse -Depth 4 -Filter '.prelude-ran-*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  prelude marker found: $($_.FullName)" }
            }
            Write-Host "after iteration $i drive-tmp-exists=$(Test-Path 'D:\tmp') contents=[$((Get-ChildItem -Force 'D:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')]"
          }
          Write-Host "total failing iterations: $failures"
