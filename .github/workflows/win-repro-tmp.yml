# TEMPORARY: reproduce the Windows fixture flake from main@fd8165f1 by looping the
# full offline suite on hosted windows-latest. Delete before the PR is opened.
name: win-repro-tmp
on:
  push:
    branches: [claude/musing-lumiere-cd9e13]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win-repro-${{ github.sha }}
  cancel-in-progress: false
jobs:
  loop:
    name: Windows suite loop (${{ matrix.variant }} ${{ matrix.slot }})
    strategy:
      fail-fast: false
      matrix:
        variant: [audit-deny]
        slot: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Normalize line endings of the checkout
        shell: cmd
        run: |
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      - name: Restore the original /tmp fixture literals (diagnostics kept)
        if: startsWith(matrix.variant, 'original') || startsWith(matrix.variant, 'audit')
        shell: cmd
        run: git apply --verbose .github/workflows/win-repro-original.patch && git diff --stat
      - name: Install Python development dependencies
        shell: cmd
        run: python -m pip install -r requirements-dev.txt
      - name: Verify native bundle and fresh-store contract
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      - name: Pre-create D:\tmp with a DELETE audit rule and deny child creation (audit-deny variant)
        if: matrix.variant == 'audit-deny'
        shell: pwsh
        run: |
          auditpol /set /subcategory:"File System" /success:enable /failure:enable
          function Arm-Tmp {
            New-Item -ItemType Directory -Force 'D:\tmp' | Out-Null
            $acl = Get-Acl -Path 'D:\tmp' -Audit
            $acl.AddAuditRule((New-Object System.Security.AccessControl.FileSystemAuditRule('Everyone', 'Delete', 'None', 'None', 'Success,Failure')))
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule('Everyone', 'CreateFiles, CreateDirectories', 'None', 'None', 'Deny')))
            Set-Acl -Path 'D:\tmp' -AclObject $acl
          }
          Arm-Tmp
          try { New-Item -ItemType Directory -Path 'D:\tmp\probe' -ErrorAction Stop | Out-Null; Write-Host "SELFTEST: child creation unexpectedly succeeded" } catch { Write-Host "SELFTEST: child creation denied as intended" }
          python -c "import os; os.rmdir('/tmp'); print('SELFTEST: python removed D:\\tmp')"
          Start-Sleep -Seconds 2
          $sec = Get-WinEvent -FilterHashtable @{LogName='Security'; Id=@(4663,4660,4656)} -ErrorAction SilentlyContinue
          $n = 0
          foreach ($e in $sec) { $x = [xml]$e.ToXml(); $d = @{}; foreach ($f in $x.Event.EventData.Data) { $d[$f.Name] = $f.'#text' }; if ($d.ObjectName -like 'D:\tmp*') { $n++; Write-Host "SELFTEST event: $($e.TimeCreated.ToString('HH:mm:ss.fff')) id=$($e.Id) access=$($d.AccessMask) proc=$($d.ProcessName) obj=$($d.ObjectName)" } }
          Write-Host "SELFTEST: $n events on D:\tmp after the python rmdir (expect > 0)"
          Arm-Tmp
          (Get-Acl -Path 'D:\tmp' -Audit).Access | Format-Table -AutoSize | Out-String | Write-Host
      - name: Pre-create D:\tmp with a keep file (control variant)
        if: matrix.variant == 'original-keep'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'D:\tmp' | Out-Null
          New-Item -ItemType File -Force 'D:\tmp\.keep' | Out-Null
          Get-ChildItem -Force 'D:\tmp' | Select-Object -ExpandProperty Name
      - name: Loop the full offline suite with a D:\tmp sampler
        shell: pwsh
        run: |
          $failures = 0
          for ($i = 1; $i -le 1; $i++) {
            Write-Host "=== iteration $i === cwd=$(Get-Location) drive-tmp-exists=$(Test-Path 'D:\tmp') temp=$env:TEMP start=$(Get-Date -Format 'HH:mm:ss.fff')"
            $sampler = Start-Job -ScriptBlock {
              $prev = $null
              while ($true) {
                $e = Test-Path 'D:\tmp'
                if ($e -ne $prev) {
                  $ms = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                  $names = if ($e) { (Get-ChildItem -Force 'D:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',' } else { '' }
                  $procs = (Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'test|suite|cc-|metacodes|tinykg|python|zig|reporter|gate' } | Select-Object -ExpandProperty ProcessName | Sort-Object | Group-Object | ForEach-Object { "$($_.Name)x$($_.Count)" }) -join ','
                  "$(Get-Date -Format 'HH:mm:ss.fff') epoch_ms=$ms D:\tmp exists=$e contents=[$names] procs=[$procs]"
                  $prev = $e
                }
                Start-Sleep -Milliseconds 25
              }
            }
            & zig build test --test-timeout 5m *> "suite-$i.log"
            $code = $LASTEXITCODE
            Write-Host "iteration $i exit=$code end=$(Get-Date -Format 'HH:mm:ss.fff')"
            Stop-Job $sampler
            $events = @(Receive-Job $sampler)
            Remove-Job $sampler
            $events | ForEach-Object { Write-Host "  sampler: $_" }
            $starts = Select-String -Path "suite-$i.log" -Pattern 'test_start now_ns=(\d+) shard=(\S+) name="(.*)"' | ForEach-Object { [PSCustomObject]@{ ms = [long]($_.Matches[0].Groups[1].Value) / 1000000; shard = $_.Matches[0].Groups[2].Value; name = $_.Matches[0].Groups[3].Value } }
            foreach ($ev in $events) {
              if ($ev -match 'epoch_ms=(\d+) D:\\tmp exists=False') {
                $t = [long]$Matches[1]
                Write-Host "  --- tests started within 3000 ms before the deletion at epoch_ms=$t (per shard, latest first):"
                $starts | Where-Object { $_.ms -le $t -and $_.ms -ge ($t - 3000) } | Sort-Object -Property ms -Descending | ForEach-Object { Write-Host "    +$($_.ms - $t) ms shard=$($_.shard) $($_.name)" }
              }
            }
            if ($code -ne 0) { $failures++ }
            $lines = Get-Content "suite-$i.log"
            for ($k = 0; $k -lt $lines.Count; $k++) {
              $l = $lines[$k]
              if ($l -match 'status=fail|fixture:|Build Summary|tests passed|steps succeeded') {
                Write-Host $l
                if ($l -match 'status=fail') {
                  $end = [Math]::Min($k + 12, $lines.Count - 1)
                  for ($j = $k + 1; $j -le $end; $j++) { Write-Host "    $($lines[$j])" }
                }
              }
            }
            Get-ChildItem -Force -Filter '.prelude-ran-*' | ForEach-Object { Write-Host "  prelude marker (workspace): $($_.Name)" }
            Write-Host "  C:\tmp exists=$(Test-Path 'C:\tmp') contents=[$((Get-ChildItem -Force 'C:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')]"
            foreach ($root in @('D:\', 'C:\tmp', 'C:\Users\runneradmin', "$env:TEMP")) {
              Get-ChildItem -Path $root -Force -Recurse -Depth 4 -Filter '.prelude-ran-*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  prelude marker found: $($_.FullName)" }
            }
            if ('${{ matrix.variant }}' -like 'audit*') {
              Write-Host "  --- Security log: handles opened on D:\tmp itself with DELETE access (4663/4660/4659/4656):"
              $sec = Get-WinEvent -FilterHashtable @{LogName='Security'; Id=@(4663,4660,4659,4656)} -ErrorAction SilentlyContinue
              $hits = @()
              foreach ($e in $sec) {
                $x = [xml]$e.ToXml(); $d = @{}
                foreach ($f in $x.Event.EventData.Data) { $d[$f.Name] = $f.'#text' }
                if ($d.ObjectName -eq 'D:\tmp' -or $d.ObjectName -eq 'D:\tmp\') {
                  $hits += [PSCustomObject]@{ t = $e.TimeCreated; id = $e.Id; proc = $d.ProcessName; pid = [Convert]::ToInt64($d.ProcessId, 16); access = $d.AccessMask; obj = $d.ObjectName }
                }
              }
              Write-Host "    (security events scanned: $(@($sec).Count); on D:\tmp: $(@($hits).Count))"
              $hits | Sort-Object t | ForEach-Object { Write-Host "    $($_.t.ToString('HH:mm:ss.fff')) id=$($_.id) access=$($_.access) pid=$($_.pid) proc=$($_.proc)" }
              $starts = Select-String -Path "suite-$i.log" -Pattern 'test_start now_ns=(\d+) pid=(\d+) shard=(\S+) name="(.*)"' | ForEach-Object { [PSCustomObject]@{ ms = [long]($_.Matches[0].Groups[1].Value) / 1000000; pid = [long]$_.Matches[0].Groups[2].Value; shard = $_.Matches[0].Groups[3].Value; name = $_.Matches[0].Groups[4].Value } }
              foreach ($h in ($hits | Where-Object { $_.id -eq 4663 -or $_.id -eq 4660 })) {
                $t = [long]([DateTimeOffset]$h.t.ToUniversalTime()).ToUnixTimeMilliseconds()
                $last = $starts | Where-Object { $_.pid -eq $h.pid -and $_.ms -le ($t + 50) } | Sort-Object -Property ms -Descending | Select-Object -First 3
                Write-Host "  --- event at $($h.t.ToString('HH:mm:ss.fff')) pid=$($h.pid) proc=$($h.proc): last tests started in that process:"
                $last | ForEach-Object { Write-Host "    $($_.ms - $t) ms shard=$($_.shard) $($_.name)" }
              }
            }
            Write-Host "after iteration $i drive-tmp-exists=$(Test-Path 'D:\tmp') contents=[$((Get-ChildItem -Force 'D:\tmp' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ',')]"
          }
          Write-Host "total failing iterations: $failures"
