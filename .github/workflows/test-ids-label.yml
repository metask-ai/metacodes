name: Test IDs label

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: test-ids-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates-linux:
    name: Gates (Linux)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Judge the head's Linux gates and test IDs again with the current labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/test_ids.py label-verdict --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --base HEAD^1 --summary "$GITHUB_STEP_SUMMARY"
