name: Maintainer rule control

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  rule-control:
    # The paid-budget L2 exercises the production macOS Seatbelt boundary;
    # running the closed-loop controller on Linux would skip those tests and
    # correctly fail the fail-closed release decision.
    #
    # GitHub-hosted macOS runner: ephemeral, so no PR-authored code can
    # precondition the machine that produces a release decision (the
    # isolation item ROADMAP M1 tracked for the shared self-hosted runner).
    runs-on: macos-latest
    # The closed-loop gate replays every rule's feedback suite (multiple full
    # zig build test-class runs plus Lean kernel work); a 30-minute budget was
    # measured structurally insufficient (killed at 30m with feedback still
    # executing, run 32842098328). Dispatch-only, so the long ceiling costs
    # nothing on the PR path.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # See ci.yml `gates` for the cache semantics.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      # Same Lean cache and pinned elan installer as ci.yml `gates`.
      - name: Restore Lean toolchain and build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned elan
        run: bash scripts/ci/install-elan.sh
      - name: Install Python development dependencies
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Verify checked-in TinyKG bundle
        run: python3 scripts/verify_tinykg_binary.py
      - name: Run closed-loop release gate
        run: zig build --build-file control-plane/build.zig rule-check
      - name: Upload rule-control telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metacodes-rule-control
          path: zig-out/reports/rule-control.json
          if-no-files-found: error
