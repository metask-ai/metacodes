name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Migration compatibility only: after the main ruleset disables the queue,
  # no merge_group event is emitted. This lets the migration PR itself land
  # under the old rules (doc/CI_DESIGN.md §3).
  merge_group:
  workflow_dispatch:
  # main's nightly run: the one run that saves the caches every pull request
  # restores (doc/CI_DESIGN.md §5). 19:00 UTC is 03:00 in Beijing.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read
  pull-requests: read # the version state gate reads the PR's current labels
  # The runner pools' plan, watches and stand-downs read this repository's
  # own runs and jobs (scripts/ci_pool_plan.py); read-only, which a fork's
  # pull request gets too.
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 'true' only on main's scheduled or dispatched run, which builds from empty
  # Zig caches and saves them. Every other run, pull requests included,
  # restores what main saved and saves nothing (doc/CI_DESIGN.md §5).
  WARM_CACHE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

# Topology: GitHub-hosted runners (the repository is public, hosted standard
# runners are free for public repositories, and organization policy keeps
# public repositories off the self-hosted fleet). The exceptions are the
# macOS and Windows gates of organization members' pull requests (and main's
# warm run): they try a self-hosted runner first whenever
# .github/runner-pools.json switches it on (macOS: a runner on the Mac
# Studio's `ci-host` account; Windows: off); the hosted legs take over when a
# runner is off, busy or not taking jobs (doc/CI_DESIGN.md §6).
# Each platform's hosted gates are split into legs that run in parallel on
# separate runners, and the TTY suites into shards; a small result job per
# platform reports the leg or shard results under the name the ruleset
# requires (doc/CI_DESIGN.md §4).
# Within a leg, steps run cheapest-first for fail-fast. Every runner is
# ephemeral: nothing persists between runs except the caches main's nightly
# run saves and the other runs restore (doc/CI_DESIGN.md §5).
jobs:
  # A release or reopen PR adds only what scripts/release_cut.py generates.
  # When that is proven against the merge commit, and the base commit already
  # passed a full PR run with exact-tree evidence, the gate legs and TTY shards
  # below report success without running the suites again: their steps check
  # FAST_PATH, except the checkouts and the version state gate in the
  # `checks` legs.
  # Other changes use the scope below; every doubt runs the affected suites.
  # doc/RELEASE_AUTOMATION_DESIGN.md §3, "CI fast path".
  release-fast-path:
    name: Release fast path
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # exact-tree evidence from the base's successful PR CI
    outputs:
      fast: ${{ steps.decide.outputs.fast }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Depth 2: the merge commit and both parents; on a pull request HEAD^1
      # is the base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 2
      # In a merge queue the base is the group's base_sha, which is HEAD^1
      # only for a group of one PR: a bump queued behind other PRs adds their
      # changes to the base and takes the full path. A failed fetch leaves the
      # base unknown to git, which the script reports as the full path.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              git fetch -q --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA" || echo "could not fetch the merge group base $MERGE_GROUP_BASE_SHA"
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            *)
              printf 'fast=false\nreason=full path: %s run\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          python3 scripts/release_fast_path.py --base "$base" --candidate HEAD --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT" --wait-seconds 0

  # Which suites the change can affect: scripts/ci_scope.py,
  # doc/CI_DESIGN.md §2. Only documentation changed: the gates run the
  # documentation, version-state and gate-manifest checks and nothing that
  # builds. Only documentation and the evaluation harness changed: the gates
  # run in full and the TTY suites do not. Only tests changed, or only
  # packages layers.zon trusts and their tests: the suites they touch run.
  # The legs, shards and result jobs below still run and report under their
  # own names; the legs' and shards' steps read SUITES / TTY / UNITS /
  # PRODUCT / PACKAGE_TESTS, as they read FAST_PATH. A failed decision leaves
  # them empty: everything runs.
  # It waits for the release fast path only to record it next to the scope:
  # a fast-path run reuses the base's suite results (`merged-scopes`).
  scope:
    name: Change scope
    needs: release-fast-path
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
      suites: ${{ steps.decide.outputs.suites }}
      tty: ${{ steps.decide.outputs.tty }}
      reason: ${{ steps.decide.outputs.reason }}
      doc_references: ${{ steps.decide.outputs.doc_references }}
      release_docs: ${{ steps.decide.outputs.release_docs }}
      units: ${{ steps.decide.outputs.units }}
      product: ${{ steps.decide.outputs.product }}
      offline_eval: ${{ steps.decide.outputs.offline_eval }}
      packages: ${{ steps.decide.outputs.packages }}
      package_tests: ${{ steps.decide.outputs.package_tests }}
      script_tests: ${{ steps.decide.outputs.script_tests }}
      complete: ${{ steps.decide.outputs.complete }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      # PR_LABELS: the labels in the event, which a `labeled` or
      # `unlabeled` run carries current; a migration PR takes the full scope.
      - name: Decide
        id: decide
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group)
              git fetch -q --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA" || echo "could not fetch the merge group base $MERGE_GROUP_BASE_SHA"
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            *) base="" ;;
          esac
          python3 scripts/ci_scope.py --event "$GITHUB_EVENT_NAME" --base "$base" --candidate HEAD --github-output "$GITHUB_OUTPUT" --labels "$PR_LABELS" --record "$RUNNER_TEMP/change-scope.json" --fast-path "$FAST_PATH"
      # What main's nightly run reports for this PR once it is merged
      # (`merged-scopes`).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: change-scope
          path: ${{ runner.temp }}/change-scope.json
          if-no-files-found: warn
          retention-days: 90

  # Where the macOS and Windows gates run (scripts/ci_pool_plan.py plan,
  # doc/CI_DESIGN.md §6): a platform's pool when .github/runner-pools.json
  # switches it on, the pull request's author is an organization member and a
  # slot is free, the hosted legs otherwise, both on main's warm run. It reads the pools' occupancy from this repository's own
  # runs with the run's read-only token, which a fork's pull request gets too
  # (vars and secrets it does not). It never fails: every doubt is `hosted`,
  # and an empty plan runs the hosted legs.
  runner-plan:
    name: Runner plan
    needs: [release-fast-path, scope]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      macos_mode: ${{ steps.plan.outputs.macos_mode }}
      macos_label: ${{ steps.plan.outputs.macos_label }}
      macos_zig_build_jobs: ${{ steps.plan.outputs.macos_zig_build_jobs }}
      macos_timeout_minutes: ${{ steps.plan.outputs.macos_timeout_minutes }}
      macos_pickup_timeout_minutes: ${{ steps.plan.outputs.macos_pickup_timeout_minutes }}
      macos_reason: ${{ steps.plan.outputs.macos_reason }}
      windows_mode: ${{ steps.plan.outputs.windows_mode }}
      windows_label: ${{ steps.plan.outputs.windows_label }}
      windows_zig_build_jobs: ${{ steps.plan.outputs.windows_zig_build_jobs }}
      windows_timeout_minutes: ${{ steps.plan.outputs.windows_timeout_minutes }}
      windows_pickup_timeout_minutes: ${{ steps.plan.outputs.windows_pickup_timeout_minutes }}
      windows_reason: ${{ steps.plan.outputs.windows_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
          SUITES: ${{ needs.scope.outputs.suites }}
          # Only organization members' pull requests use a self-hosted runner.
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/ci_pool_plan.py plan --github-output "$GITHUB_OUTPUT"

  # The POSIX gates, one leg per runner (doc/CI_DESIGN.md §4). The legs'
  # steps together are a superset of the AGENTS.md "Before submitting"
  # checklist; scripts/tests/test_gate_manifest.py asserts that every checklist
  # command has a step here, and that `zig build test` runs as its three parts
  # (`test:units`, `test:integration`, `test:product`), so the two cannot
  # drift apart silently. Each step names the legs it belongs to through the
  # matrix flags `units`, `product`, `release` and `checks`; a step
  # without one is environment setup and runs on every leg. Linux has a runner
  # per flag. Hosted macOS has three, since an organization runs at most
  # five macOS jobs at once; the pool runs them as one (`gates-macos-vm`).
  # 45 minutes: a cold hosted runner compiles a leg's share of the tree and
  # the Lean kernel; warm runs (setup-zig + Lean cache hits) are far shorter.
  gates-linux:
    name: Gates (Linux) / ${{ matrix.leg }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: units
            units: true
          - leg: product
            product: true
          - leg: release
            release: true
          - leg: checks
            checks: true
    runs-on: ubuntu-latest
    needs: [release-fast-path, scope]
    # A failed decision leaves FAST_PATH and SUITES empty: run in full rather
    # than skip.
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' only for a documentation-only change: the steps that also run
      # then are the checkout, the version state gate and the documentation
      # and gate-manifest checks (scripts/tests/test_ci_scope.py pins the list).
      SUITES: ${{ needs.scope.outputs.suites }}
      DOC_REFERENCES: ${{ needs.scope.outputs.doc_references }}
      RELEASE_DOCS: ${{ needs.scope.outputs.release_docs }}
      # The suites a tests or packages scope selects (scripts/ci_scope.py):
      # 'false' skips a suite step, PACKAGE_TESTS replaces test:units and
      # skips the other whole-package unit runs (the ReleaseSafe core gate,
      # the native platform modules).
      UNITS: ${{ needs.scope.outputs.units }}
      PRODUCT: ${{ needs.scope.outputs.product }}
      OFFLINE_EVAL: ${{ needs.scope.outputs.offline_eval }}
      PACKAGE_TESTS: ${{ needs.scope.outputs.package_tests }}
      SCRIPT_TESTS: ${{ needs.scope.outputs.script_tests }}
      COMPLETE: ${{ needs.scope.outputs.complete }}
      # The suite steps' build runner jobs; see "Offline test suite" below.
      ZIG_BUILD_JOBS: "8"
      # The release layout splits the Linux executable's debug symbols into
      # their own archive, as release.yml does (doc/RELEASE_RUNNER.md).
      RELEASE_SYMBOLS: "-Drelease-symbols=true"
    steps: &gates-steps
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: ${{ env.POOL_JOB != 'true' }}
      # The pool job only (POOL_JOB): its env leaves FAST_PATH unset and this
      # step sets it. If the watch already finished, the hosted legs took over
      # before a VM took this job, so FAST_PATH=true and every later step
      # skips; otherwise it carries the release fast path decision
      # (scripts/ci_pool_plan.py stand-down, doc/CI_DESIGN.md §6).
      - name: Stand down if the hosted legs took over
        if: env.POOL_JOB == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_pool_plan.py stand-down --platform macos --github-env "$GITHUB_ENV"
      - name: Keep the caches on the pool host
        if: env.POOL_JOB == 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          for cache in .zig-cache control-plane/lean/.lake; do
            if [ -L "$cache" ]; then rm "$cache"; fi
          done
          if [ "$WARM_CACHE" = "true" ]; then rm -rf .zig-cache; fi
          git clean -ffdx -e /.zig-cache -e /control-plane/lean/.lake
          test -z "$(git status --porcelain --untracked-files=normal)"
      # setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at
      # .zig-cache. Its own cache stays off, since it saves on every run; the
      # steps below restore and save explicitly (doc/CI_DESIGN.md §5). Zig's
      # cache is content-addressed and folds the compiler version into every
      # hash, so a restored directory is always safe; test execution is not
      # affected because test Run steps are has_side_effects in build.zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && (env.SUITES != 'false' || (runner.os == 'Linux' && matrix.checks && env.RELEASE_DOCS != 'false'))
        with:
          version: 0.16.0
          use-cache: false
      # Every run but main's warm one restores the newest Zig cache main saved
      # for this leg. A pull request can read its base branch's caches, never
      # another pull request's, and saves none of its own. The key is the
      # prefix of what main saves (its run ID follows), so the newest wins.
      # Each leg builds a different share of the graph and keeps its own line.
      - name: Restore the Zig cache main saved
        if: env.WARM_CACHE != 'true' && env.POOL_JOB != 'true' && env.FAST_PATH != 'true' && (env.SUITES != 'false' || (runner.os == 'Linux' && matrix.checks && env.RELEASE_DOCS != 'false'))
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-
          restore-keys: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-
      # The source-level guards (fmt, the boundary gates, the discipline
      # scans, git diff --check) take seconds, and the build runner has no
      # fail-fast: inside a suite step a failed guard is reported only when
      # the whole leg has finished. So every leg runs them first (#587).
      - name: Source-level guards
        if: (matrix.units || matrix.product || matrix.release || matrix.checks) && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build gate:static
      # Lean toolchain and build products. Key: the pinned toolchain plus every
      # Lean source, so a source change rebuilds from the previous products
      # (restore-keys) and Lake hash-verifies what it restores; a stale or
      # torn copy self-heals into a rebuild rather than wrong results. Every
      # run restores; only main's warm run saves (after the kernel build).
      - name: Restore Lean toolchain and build products
        id: lean
        if: env.POOL_JOB != 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      # scripts/ci/install-elan.sh: a pinned elan release asset with a pinned
      # SHA-256, never the mutable elan-init.sh from elan's master branch (the
      # reason lean-action was dropped). A no-op on a cache hit. The toolchain
      # named in control-plane/lean/lean-toolchain installs on first use
      # through elan's own resolver into ~/.elan, which the cache above
      # persists.
      - name: Install pinned elan
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: bash scripts/ci/install-elan.sh
      - name: Build pinned Lean kernel
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          (cd control-plane/lean && lake build)
          # The project-harness kernel is linked and smoked by its build
          # script, not by `lake build`: the smoke requests are hand-written
          # canonical JSON that the strict Lean parser must accept field for
          # field, and nothing else exercises that pairing. They drifted from
          # the kernel for three weeks (within_root, 33cf238) because no job
          # ran the script on any platform. The output goes outside the
          # workspace so no test can pick up a kernel that the suite did not
          # stage itself. One line: test_gate_manifest.py shlex-splits every
          # line of this block on its own.
          LAKE="$(command -v lake)" bash scripts/build-project-harness-kernel.sh "$RUNNER_TEMP/metacodes-project-kernel"
      # One leg saves, once per state of the Lean sources (the key is their
      # hash): an exact hit means main already holds this state.
      - name: Save Lean toolchain and build products
        if: env.WARM_CACHE == 'true' && env.POOL_JOB != 'true' && matrix.units && steps.lean.outputs.cache-hit != 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: ${{ steps.lean.outputs.cache-primary-key }}
      - name: Install ripgrep
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_ARCH" in
              X64) arch=x86_64 ;;
              ARM64) arch=aarch64 ;;
              *) echo "no vendored ripgrep for runner arch $RUNNER_ARCH" >&2; exit 1 ;;
            esac
            case "$RUNNER_OS" in
              Linux) os=linux ;;
              macOS) os=macos ;;
              *) echo "no vendored ripgrep for runner OS $RUNNER_OS" >&2; exit 1 ;;
            esac
            python3 scripts/stage_ripgrep_binary.py "$arch" "$os" "$RUNNER_TEMP/ripgrep"
            echo "$RUNNER_TEMP/ripgrep" >> "$GITHUB_PATH"
          fi
      # scripts/build_project_rule.py isolates a candidate rule's Lean build in
      # bubblewrap on Linux (sandbox-exec on macOS); the native project-Harness
      # suites `zig build test` wires when bwrap is present exercise it.
      # Ubuntu 24.04 confines unprivileged user namespaces through AppArmor,
      # so bwrap needs that lifted; the smoke runs the builder's own flags so
      # a broken sandbox fails here instead of deep in the suite.
      - name: Install bubblewrap
        if: runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sandbox=(--unshare-all --die-with-parent --new-session --proc /proc --dev /dev --tmpfs /tmp)
          runtime=(--ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64)
          bwrap "${sandbox[@]}" "${runtime[@]}" /bin/true
      # PyYAML for scripts/eval/workbuddy and its tests (requirements-dev.txt).
      # --break-system-packages: the hosted images' system Python is PEP 668
      # "externally managed"; the runner is ephemeral so there is nothing to
      # protect.
      - name: Install Python development dependencies
        if: env.FAST_PATH != 'true'
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      # Only a run of every suite records them: a narrowed run's IDs would
      # read as tests that disappeared (scripts/test_ids.py).
      - name: Record the executed test IDs
        if: runner.os == 'Linux' && (matrix.units || matrix.product || matrix.checks) && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.COMPLETE != 'false'
        run: mkdir -p "$RUNNER_TEMP/test-ids" && echo "METACODES_TEST_IDS_DIR=$RUNNER_TEMP/test-ids" >> "$GITHUB_ENV"
      # A version without -dev is legal only on its tagged commit, the release
      # PR, or main's run of the release merge commit; in the latter two the
      # gate tags HEAD locally so the release-layout steps below can run the
      # stable channel on the candidate (doc/RELEASE_AUTOMATION_DESIGN.md §3).
      # The labels are read now, not taken from the event: `gh pr create
      # --label` adds the label after it creates the PR, and the `opened`
      # payload of release: 0.2.1 (#176) carried none, so the gate refused
      # its own release PR. On the release fast path this and the checkout are
      # the only steps that run, so the gate skips the rehearsal tag. A merge
      # queue group carries no PR in its event: its ref names the PR at its
      # head, the newest entry (gh-readonly-queue/<base>/pr-<n>-<sha>), and
      # the gate judges that PR's head branch, title and labels. So the
      # release PR passes only as its group's head, and a PR queued behind it
      # sees the bare version and is refused, exactly as it would be on main
      # (doc/CI_DESIGN.md §3; it relies on the queue's ALLGREEN setting).
      - name: Version state gate and release rehearsal
        if: matrix.checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # A request that gets no answer (a network blip on a self-hosted
          # runner) or a 5xx is tried 3 times; an HTTP 4xx answer fails at once.
          gh_api() {
            local delay out err
            err=$(mktemp)
            for delay in 10 30 ""; do
              if out=$(gh api "$@" 2>"$err"); then
                rm -f "$err"
                printf '%s\n' "$out"
                return 0
              fi
              cat "$err" >&2
              if [ -z "$delay" ] || grep -q 'HTTP 4[0-9][0-9]' "$err"; then
                rm -f "$err"
                return 1
              fi
              echo "gh api $1 failed; retrying in ${delay}s" >&2
              sleep "$delay"
            done
          }
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "not a merge queue ref: $MERGE_GROUP_HEAD_REF" >&2
              exit 1
            fi
            RELEASE_PR_NUMBER=${BASH_REMATCH[1]}
            GITHUB_HEAD_REF=$(gh_api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)
            RELEASE_PR_TITLE=$(gh_api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .title)
            export GITHUB_HEAD_REF RELEASE_PR_TITLE
          fi
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            RELEASE_PR_LABELS=$(gh_api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR_NUMBER/labels" --jq '[.[].name] | join(",")')
            export RELEASE_PR_LABELS
          fi
          if [ "$FAST_PATH" = "true" ]; then
            python3 scripts/check_version_state.py
          else
            python3 scripts/check_version_state.py --rehearse
          fi
      - name: TinyKG binary-contract unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_stage_tinykg_binary -v
      - name: ripgrep binary-contract unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_stage_ripgrep_binary -v
      - name: Trajectory audit unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_audit_trajectories -v
      - name: Verify native bundle and fresh-store contract
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          python3 scripts/verify_tinykg_binary.py
          python3 scripts/verify_ripgrep_binary.py
          zig build tinykg:stage
      # One binary from the platform root, whose test block references every
      # module: a per-module list here missed terminal.zig and timezone.zig.
      # Standalone `zig test`, not `zig build`, with METACODES_PROC_TEST=1:
      # the spawn tests are kept out of the build runner (process.zig's
      # `procSpawnTestsEnabled`).
      - name: Native platform modules
        if: matrix.units && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PACKAGE_TESTS == ''
        shell: bash
        env:
          METACODES_PROC_TEST: "1"
          METACODES_TEST_ROOT: src/platform
        run: zig test src/platform/platform.zig -lc --test-runner scripts/recording_test_runner.zig --name native-platform
      # The installed-adapter WorkBuddy suites (scripts/eval/tests/
      # test_workbuddy_adapter.py) run the overlay inside the real pinned
      # WorkBuddy-Bench, against its locked environment; without a checkout
      # they skip. provision_checkout.sh fetches the pinned commit, installs
      # this repository's overlay and `uv sync`s it; the product part below
      # inherits METACODES_WORKBUDDY_CHECKOUT through zig build.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.OFFLINE_EVAL != 'false'
        with:
          version: "0.11.19"
      - name: Provision the pinned WorkBuddy-Bench checkout
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.OFFLINE_EVAL != 'false'
        shell: bash
        run: |
          set -euo pipefail
          checkout=$(scripts/eval/workbuddy/provision_checkout.sh "$RUNNER_TEMP/workbuddy-bench")
          echo "METACODES_WORKBUDDY_CHECKOUT=$checkout" >> "$GITHUB_ENV"
      # `zig build test` as its three parts (build.zig: `test` is exactly
      # `test:units`, `test:integration` and `test:product`): units and
      # integration on one leg, product on another.
      # METACODES_TEST_REQUIRE_LEAN_SDK: every leg builds control-plane/lean
      # above, so a missing/mislocated ProjectRule.olean is a regression, not
      # an environment gap: fail instead of skip. --test-timeout 5m: the build
      # runner watchdog between tests is max(--test-timeout, 60s); same value
      # as the Windows leg and the AgentCore gate, so a wedged test on a
      # loaded runner is reported instead of eating the job timeout.
      # -Dlean-kernels=on: the suite builds both kernels from this checkout
      # and every kernel-gated test runs; a missing toolchain fails the build
      # instead of skipping them. --summary all: every step with its duration,
      # the evidence for the next split of the legs. -j: the build runner runs
      # at most that many steps at once, one per core by default, and a run
      # step holds its slot while its child mostly waits (a smoke on a loopback
      # daemon, the evaluation suite on its subprocesses). At one per core the
      # smokes kept the evaluation suite, or the drivers it needs, from
      # starting for four to seven minutes; twice that many keeps the cores
      # busy. Scheduling only: what runs is the same.
      - name: Offline test suite (units and integration)
        if: matrix.units && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.UNITS != 'false' && env.PACKAGE_TESTS == ''
        env:
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        run: zig build test:units test:integration -j"$ZIG_BUILD_JOBS" --test-timeout 5m -Dlean-kernels=on --summary all
      # A packages scope: the affected packages' test:<package> steps in place
      # of test:units (doc/CI_DESIGN.md §2).
      - name: Offline test suite (affected packages and integration)
        if: matrix.units && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.UNITS != 'false' && env.PACKAGE_TESTS != ''
        env:
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        run: |
          read -r -a steps <<< "$PACKAGE_TESTS"
          zig build "${steps[@]}" test:integration -j"$ZIG_BUILD_JOBS" --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (product)
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PRODUCT != 'false' && env.OFFLINE_EVAL != 'false'
        env:
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        run: zig build test:product -j"$ZIG_BUILD_JOBS" --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (product runtime)
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PRODUCT != 'false' && env.OFFLINE_EVAL == 'false'
        run: zig build test:product-runtime -j"$ZIG_BUILD_JOBS" --test-timeout 5m -Dlean-kernels=on --summary all
      - name: ReleaseSafe core gate
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PACKAGE_TESTS == ''
        run: zig build test:lib -Doptimize=ReleaseSafe
      - name: Contract snapshots
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build test:contract --summary all
      - name: Repository coverage audit
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: scripts/test_coverage_audit.sh
      - name: Documentation link check
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true'
        run: python3 scripts/check_doc_links.py
      - name: Default install prefix
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build --prefix "$RUNNER_TEMP/install-prefix" && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/install-prefix" --doctor
      # The footprint red lines of doc/PERF_MEMORY_PRINCIPLES.md §2 (the
      # ReleaseSmall binary size, warm `--help` start, idle peak RSS), measured
      # by scripts/perf_baseline.sh into the job summary (#303). Report-only
      # until a few weeks of numbers exist: shared-runner timing noise must not
      # block a merge, so a line over its limit marks this step failed and
      # leaves the leg green. Here because the step above just built the same
      # ReleaseSmall executable (its optimize mode ignores -Doptimize), so
      # `--build` is a cache hit, not another LLVM build. The script needs
      # /usr/bin/time (-l on macOS, -v on Linux), perl and bc; one missing on
      # Linux is installed, and one missing anywhere fails the step instead of
      # measuring zero.
      - name: Footprint red lines (report-only)
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        continue-on-error: true
        shell: bash
        run: |
          missing=""
          [ -x /usr/bin/time ] || missing="$missing time"
          command -v perl >/dev/null 2>&1 || missing="$missing perl"
          command -v bc >/dev/null 2>&1 || missing="$missing bc"
          if [ -n "$missing" ] && [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y $missing; fi
          status=0
          scripts/perf_baseline.sh --build > "$RUNNER_TEMP/footprint.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/footprint.txt"
          {
            echo "### Footprint red lines, $RUNNER_OS $RUNNER_ARCH (report-only, #303)"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/footprint.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Footprint red lines::scripts/perf_baseline.sh exited $status on $RUNNER_OS $RUNNER_ARCH (report-only); see the job summary"; fi
          exit "$status"
      # The sidecar the kernel build script wrote, read by the installed
      # product's own loader: the pairing no unit test can cover (the project
      # kernel's v6 sidecar was validated with the formal v4 loader for as long
      # as nothing ran a real one through doctor, 2026-09-21).
      - name: Built project kernel provenance is accepted by doctor
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/verify_kernel_provenance.py "$RUNNER_TEMP/install-prefix/bin/metacodes" --project "$RUNNER_TEMP/metacodes-project-kernel"
      # Manifest v2 ships both Lean kernels and pins them, so the release
      # layout is two invocations (release/LAYOUT.md): stage the kernels, then
      # build the executable with their digests. KERNEL_PINS carries them to
      # the archive steps.
      - name: Stage Lean kernels for the release layout
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          zig build kernels:stage -Dlean-kernels=on --prefix "$RUNNER_TEMP/release-prefix"
          pins=$(python3 scripts/kernel_pins.py "$RUNNER_TEMP/release-prefix")
          echo "KERNEL_PINS=$pins" >> "$GITHUB_ENV"
      - name: Release layout prefix
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: zig build release:verify -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS $RELEASE_SYMBOLS && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/release-prefix" --release --doctor
      # The installer, through the same script users run, on the verified
      # unit: every file re-verified at the new prefix, an install record and
      # state root of its own, and the installed executable's doctor --strict.
      - name: Install the release unit with scripts/install.sh
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: sh scripts/install.sh --no-link --prefix "$RUNNER_TEMP/installed" "$RUNNER_TEMP/release-prefix" && "$RUNNER_TEMP/installed/bin/metacodes" doctor --strict
      - name: Release bundle verifier self-test
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: |
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS $RELEASE_SYMBOLS -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS $RELEASE_SYMBOLS -Drelease-archive-dir="$RUNNER_TEMP/dist-2"
          ls "$RUNNER_TEMP"/dist-1
          same=true
          for archive in "$RUNNER_TEMP"/dist-1/metacodes-*.tar.gz; do cmp "$archive" "$RUNNER_TEMP/dist-2/$(basename "$archive")" || same=false; done
          if [ "$same" != true ]; then
            # Evidence for the next mismatch: which members differ.
            mkdir -p "$RUNNER_TEMP/unpacked-1" "$RUNNER_TEMP/unpacked-2"
            for archive in "$RUNNER_TEMP"/dist-1/metacodes-*.tar.gz; do tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked-1"; done
            for archive in "$RUNNER_TEMP"/dist-2/metacodes-*.tar.gz; do tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked-2"; done
            diff -rq "$RUNNER_TEMP/unpacked-1" "$RUNNER_TEMP/unpacked-2" || true
            cat "$RUNNER_TEMP"/unpacked-*/*/libexec/metacodes/*.build-receipt.json || true
            exit 1
          fi
          zig build release:sums -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" $KERNEL_PINS $RELEASE_SYMBOLS -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          cat "$RUNNER_TEMP"/dist-1/metacodes-*-SHA256SUMS
      # Keep the native ARM64 baseline in PR CI. Intel macOS is built and
      # tested on its own runner by release.yml, rather than cross-built here.
      - name: macOS release executables need no more than their targets
        if: matrix.release && runner.os == 'macOS' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-macos.13.0; do
            zig build install -Drelease-layout=true -Doptimize=ReleaseSafe -Dtarget="$target" --prefix "$RUNNER_TEMP/baseline-$target"
            python3 scripts/check_binary_baseline.py --target "$target" "$RUNNER_TEMP/baseline-$target/bin/metacodes"
          done
      - name: Third-party notices check
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.RELEASE_DOCS != 'false'
        run: python3 scripts/gen_third_party_notices.py --check
      - name: Protocol document references
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.DOC_REFERENCES != 'false'
        run: python3 scripts/eval/plugin_release_gate.py --validate-only
      - name: Release document package check
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.RELEASE_DOCS != 'false'
        run: zig build release:docs:check --prefix "$RUNNER_TEMP/release-documents" --summary all
      - name: Release document check unit tests
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.RELEASE_DOCS != 'false'
        run: python3 -m unittest scripts.tests.test_check_release_docs -v
      - name: Documentation fact check
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true'
        run: python3 scripts/check_doc_facts.py
      - name: Changelog entries are unreleased
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            *) echo "no base to compare on a $GITHUB_EVENT_NAME run"; exit 0 ;;
          esac
          python3 scripts/check_changelog_sections.py --base "$base"
      - name: Layer baseline only shrinks
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            *) echo "no base to compare on a $GITHUB_EVENT_NAME run"; exit 0 ;;
          esac
          zig build layer:check -Dlayer-base="$base"
      - name: Changelog section check unit tests
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true'
        run: python3 -m unittest scripts.tests.test_check_changelog_sections -v
      - name: Documentation fact-check unit tests
        if: matrix.checks && env.FAST_PATH != 'true'
        run: python3 -m unittest scripts.tests.test_check_doc_facts -v
      - name: Third-party notices unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.RELEASE_DOCS != 'false'
        run: python3 -m unittest scripts.tests.test_gen_third_party_notices -v
      - name: Gate manifest unit tests
        if: matrix.checks && env.FAST_PATH != 'true'
        run: python3 -m unittest scripts.tests.test_gate_manifest -v
      - name: Install linters
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m pip install --break-system-packages -r requirements-lint.txt
      - name: Lint
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 scripts/lint.py
      - name: Lint unit tests
        if: matrix.checks && runner.os == 'Linux' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_lint -v
      - name: Verify install prefix unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Install script unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_install_scripts -v
      - name: Release binary baseline check unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_check_binary_baseline -v
      - name: Kernel self-containment and pin unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_check_kernel_self_contained scripts.tests.test_kernel_pins -v
      - name: Kernel provenance verifier unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_verify_kernel_provenance -v
      - name: Python floor unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_python_floor -v
      # scripts/build_project_rule.py's own suite: no workflow ran it before
      # test_gate_manifest.py started requiring every scripts/tests module
      # to run somewhere.
      - name: Project rule builder unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_build_project_rule -v
      - name: Release cut unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_release_cut -v
      - name: Release fast path unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_release_fast_path -v
      - name: Change scope unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_ci_scope -v
      # A tests scope may skip test:units, which runs some of these suites.
      - name: Changed script unit suites
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.SCRIPT_TESTS != ''
        run: |
          read -r -a modules <<< "$SCRIPT_TESTS"
          python3 -m unittest "${modules[@]}" -v
      - name: CI evidence unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_ci_evidence -v
      - name: SDK package version unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_sdk_package_versions -v
      - name: AgentCore release unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_agentcore_release -v
      - name: Runner plan and VM pool unit tests
        if: matrix.checks && env.FAST_PATH != 'true' && env.SUITES != 'false'
        run: python3 -m unittest scripts.tests.test_ci_pool_plan scripts.tests.test_vm_pool -v
      - name: Diff whitespace check
        if: matrix.checks && env.FAST_PATH != 'true'
        run: git diff --check
      - name: Upload the executed test IDs
        if: runner.os == 'Linux' && (matrix.units || matrix.product || matrix.checks) && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.COMPLETE != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-ids-raw-${{ matrix.leg }}
          path: ${{ env.METACODES_TEST_IDS_DIR }}
          if-no-files-found: error
          retention-days: 3
      # main's warm run saves what this leg built from an empty cache, so the
      # entry holds only what the current tree needs and does not grow night
      # after night. A failed leg saves nothing and the previous night's entry
      # stays. Cache keys are immutable, hence the run ID in each.
      - name: Save the Zig cache for pull requests
        if: env.WARM_CACHE == 'true' && env.POOL_JOB != 'true' && env.FAST_PATH != 'true' && (env.SUITES != 'false' || (runner.os == 'Linux' && matrix.checks && env.RELEASE_DOCS != 'false'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-${{ github.run_id }}-${{ github.run_attempt }}

  # The same steps (the YAML alias of `gates-linux`'s list) on three hosted
  # macOS runners: units and integration with the checks, product, and
  # release. Each waits on its own LLVM builds (the integration suite on the
  # ReleaseSmall app, the evaluation suite on two ReleaseSafe drivers, the
  # release layout on two more ReleaseSmall builds), which a three-core runner
  # cannot overlap with the rest. A leg's flags are what its steps read, not
  # its name. They run unless the plan sent the gates to the pool and a VM
  # took them: at once on `hosted` or an empty plan, beside the pool job on
  # `both`, and on `self-hosted` only when the watch fell back (§6). The
  # Windows legs (`windows-gates`) do the same.
  gates-macos:
    name: Gates (macOS) / ${{ matrix.leg }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: units-checks
            units: true
            checks: true
          - leg: product
            product: true
          - leg: release
            release: true
    runs-on: macos-latest
    needs: [release-fast-path, scope, runner-plan, gates-macos-watch]
    if: ${{ !cancelled() && (needs.runner-plan.outputs.macos_mode != 'self-hosted' || needs.gates-macos-watch.outputs.fallback == 'true') }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      SUITES: ${{ needs.scope.outputs.suites }}
      DOC_REFERENCES: ${{ needs.scope.outputs.doc_references }}
      RELEASE_DOCS: ${{ needs.scope.outputs.release_docs }}
      UNITS: ${{ needs.scope.outputs.units }}
      PRODUCT: ${{ needs.scope.outputs.product }}
      OFFLINE_EVAL: ${{ needs.scope.outputs.offline_eval }}
      PACKAGE_TESTS: ${{ needs.scope.outputs.package_tests }}
      SCRIPT_TESTS: ${{ needs.scope.outputs.script_tests }}
      COMPLETE: ${{ needs.scope.outputs.complete }}
      # Two per core, as on Linux, would overlap more LLVM builds than the
      # runner's 7 GB hold (the app and the drivers peak at 1 to 2 GB each).
      ZIG_BUILD_JOBS: "6"
    steps: *gates-steps

  # The macOS gates as one job on the self-hosted runner (doc/CI_DESIGN.md
  # §6): it has the cores and memory a hosted runner lacks, so one job runs
  # what the hosted legs split, without their repeated checkout, setup and
  # compilation. It is the runner on the Mac Studio's `ci-host` account: jobs
  # share the host and nothing isolates one from the next, so only
  # organization members' pull requests are sent to it, and the runner's own
  # pre-job hook fails any other author's job.
  # FAST_PATH is left to the stand-down step.
  gates-macos-vm:
    name: Gates (macOS) / ${{ matrix.leg }}
    needs: [release-fast-path, scope, runner-plan]
    if: ${{ !cancelled() && (needs.runner-plan.outputs.macos_mode == 'self-hosted' || needs.runner-plan.outputs.macos_mode == 'both') }}
    timeout-minutes: ${{ fromJSON(needs.runner-plan.outputs.macos_timeout_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: all
            units: true
            checks: true
            product: true
            release: true
    runs-on: ${{ needs.runner-plan.outputs.macos_label }}
    env:
      POOL_JOB: "true"
      RELEASE_FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      SUITES: ${{ needs.scope.outputs.suites }}
      DOC_REFERENCES: ${{ needs.scope.outputs.doc_references }}
      RELEASE_DOCS: ${{ needs.scope.outputs.release_docs }}
      UNITS: ${{ needs.scope.outputs.units }}
      PRODUCT: ${{ needs.scope.outputs.product }}
      OFFLINE_EVAL: ${{ needs.scope.outputs.offline_eval }}
      PACKAGE_TESTS: ${{ needs.scope.outputs.package_tests }}
      SCRIPT_TESTS: ${{ needs.scope.outputs.script_tests }}
      COMPLETE: ${{ needs.scope.outputs.complete }}
      # .github/runner-pools.json, sized to the runner.
      ZIG_BUILD_JOBS: ${{ needs.runner-plan.outputs.macos_zig_build_jobs }}
    steps: *gates-steps

  # Follows the pool job of this run (scripts/ci_pool_plan.py watch): a VM
  # that takes it within the pickup timeout is followed to the end; otherwise
  # `fallback=true` hands the gates to the hosted legs. The required check
  # reads this job's outputs instead of waiting for the pool job, which a pool
  # that is down would keep queued for GitHub's 24 hours. It fails when the
  # pool job does, so rerunning failed jobs reruns it as well.
  gates-macos-watch:
    name: macOS pool watch
    needs: [runner-plan]
    if: ${{ !cancelled() && (needs.runner-plan.outputs.macos_mode == 'self-hosted' || needs.runner-plan.outputs.macos_mode == 'both') }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      fallback: ${{ steps.watch.outputs.fallback }}
      vm_result: ${{ steps.watch.outputs.vm_result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Wait for a VM to take the pool job
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          PICKUP_TIMEOUT_MINUTES: ${{ needs.runner-plan.outputs.macos_pickup_timeout_minutes }}
        run: python3 scripts/ci_pool_plan.py watch --platform macos --pickup-timeout-minutes "$PICKUP_TIMEOUT_MINUTES" --github-output "$GITHUB_OUTPUT"

  # The Python and Node packages over the AgentCore shared library (sdk/python,
  # sdk/node). Not a required check yet: it builds a ReleaseSafe bundle, which
  # the required gates do not, then runs both packages' end-to-end suites
  # against a loopback mock provider (no network, no key), including the
  # installed wheel in a clean virtualenv. Windows waits for the Node addon's
  # Windows port.
  sdk-bindings:
    name: SDK bindings (${{ matrix.os }})
    # A change confined to documentation or the evaluation harness (scope
    # docs or eval, tty=false) cannot affect the packages, so the steps are
    # skipped; an empty scope output (the decision failed) runs them. The
    # job itself always runs and reports under its own name, like the
    # required jobs (doc/CI_DESIGN.md §1), so it can be made required
    # without holding documentation-only PRs.
    needs: scope
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-linux-gnu
          - os: macOS
            runner: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    env:
      SDK: ${{ needs.scope.outputs.tty }}
    steps:
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SDK != 'false'
      # Caches as in `gates-linux` (doc/CI_DESIGN.md §5).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.SDK != 'false'
        with:
          version: 0.16.0
          use-cache: false
      - name: Restore the Zig cache main saved
        if: env.WARM_CACHE != 'true' && env.SDK != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-sdk-run-
          restore-keys: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-sdk-run-
      - name: Build the AgentCore bundle
        if: env.SDK != 'false'
        run: |
          zig build agentcore:bundle -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/sdk"
          bundle=$(ls -d "$RUNNER_TEMP"/sdk/agentcore/*/ | head -n 1)
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "AGENTCORE_LIB=$(python3 -c 'import json,os,sys; b=sys.argv[1]; print(os.path.join(b, json.load(open(os.path.join(b, "manifest.json")))["shared_library"]["path"]))' "$bundle")" >> "$GITHUB_ENV"
      - name: Python package end-to-end suite
        if: env.SDK != 'false'
        env:
          METACODES_PY_SDK_REQUIRE_LIB: "1"
        run: METACODES_AGENTCORE_LIB="$AGENTCORE_LIB" python3 -m unittest discover -s sdk/python/tests -v
      - name: Python wheel installs and passes the suite from site-packages
        if: env.SDK != 'false'
        env:
          METACODES_PY_SDK_REQUIRE_LIB: "1"
          METACODES_PY_SDK_TEST_INSTALLED: "1"
        run: |
          python3 sdk/python/build_wheel.py --bundle "$BUNDLE" --out "$RUNNER_TEMP/wheels"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index "$RUNNER_TEMP"/wheels/*.whl
          mkdir -p "$RUNNER_TEMP/empty-home"
          cd "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/empty-home" "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/sdk/python/tests" -v
      - name: Node addon builds against this Node's headers
        if: env.SDK != 'false'
        run: |
          node --version
          node sdk/node/scripts/build.js --bundle "$BUNDLE"
      - name: Node package end-to-end suite
        if: env.SDK != 'false'
        env:
          METACODES_NODE_SDK_REQUIRE_LIB: "1"
        run: node --test sdk/node/test/metacodes.test.js
      # The formal path on the real build, which no real run reaches between
      # releases: a final version through agentcore:archive, the wheel, the Node
      # package and the door, in a scratch worktree, tagged locally, never pushed.
      - name: Rehearse a formal AgentCore release
        if: env.SDK != 'false'
        run: python3 scripts/agentcore_release.py rehearse --target ${{ matrix.target }} --work "$RUNNER_TEMP/rehearsal"
      - name: Save the Zig cache for pull requests
        if: env.WARM_CACHE == 'true' && env.SDK != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-sdk-run-${{ github.run_id }}-${{ github.run_attempt }}

  # The offline TTY suite (tests/tty) drives the debug binary in a pseudo
  # terminal and asserts the screen a person would see. No workflow ran it
  # before #222: twelve agent-tree cases stayed red for weeks (#218), and a
  # Windows-only service stall looked like a slow machine. Run the cases with
  # Python directly on POSIX (tests/tty/README.md: the build runner's stdio
  # supervision disturbs pty timing); Windows goes through `windows:tty`.
  #
  # The cases run one at a time and mostly wait on the screen, so the suite is
  # split into shards on separate runners rather than run concurrently on one
  # (pty timing is what the cases assert). TTY_SHARD=K/N picks every N-th
  # case of the sorted list, starting at the K-th (tests/tty/run_tty_tests.py;
  # a TTY case checks that the shards partition the list); `zig build
  # windows:tty` passes it through. Each shard builds the debug binary itself,
  # a warm-cache build of seconds on Linux and about two minutes on Windows.
  # 30 minutes: about 16 minutes of cases on POSIX and 28 under ConPTY in
  # all, a third or an eighth of that per shard, plus a cold debug build.
  tty-linux:
    name: TTY (Linux) / ${{ matrix.shard }} of ${{ strategy.job-total }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    needs: [release-fast-path, scope]
    # A failed decision leaves FAST_PATH and TTY empty: run in full rather
    # than skip.
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' for a change confined to documentation and the evaluation
      # harness, which the TTY suites neither build nor read.
      TTY: ${{ needs.scope.outputs.tty }}
      TTY_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps: &tty-steps
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FAST_PATH != 'true' && env.TTY != 'false'
      # The binary embeds files byte for byte; see `windows-gates`.
      - name: Normalize line endings of the checkout
        if: runner.os == 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        shell: cmd
        run: |
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      # See `gates-linux` for the caches. Every shard builds the same
      # binaries, so they share one cache line, which shard 1 saves.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && env.TTY != 'false'
        with:
          version: 0.16.0
          use-cache: false
      - name: Restore the Zig cache main saved
        if: env.WARM_CACHE != 'true' && env.FAST_PATH != 'true' && env.TTY != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-tty-run-
          restore-keys: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-tty-run-
      - name: Offline TTY suite (POSIX pty)
        if: runner.os != 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        env:
          TTY_SKIP_MODEL: "1"
        run: |
          zig build dev test:harness
          python3 tests/tty/run_tty_tests.py --bin zig-out/bin/metacodes-debug
      # pywinpty provides the ConPTY backend of tests/tty/tty_driver.py; the
      # version the Windows failures of #218-#220 were measured with.
      - name: Offline TTY suite (ConPTY)
        if: runner.os == 'Windows' && env.FAST_PATH != 'true' && env.TTY != 'false'
        shell: cmd
        run: |
          python -m pip install pywinpty==3.0.5 || exit /b 1
          zig build windows:tty -Dtarget=x86_64-windows-gnu
      - name: Save the Zig cache for pull requests
        if: env.WARM_CACHE == 'true' && matrix.shard == 1 && env.FAST_PATH != 'true' && env.TTY != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-tty-run-${{ github.run_id }}-${{ github.run_attempt }}

  tty-windows:
    name: TTY (Windows) / ${{ matrix.shard }} of ${{ strategy.job-total }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    needs: [release-fast-path, scope]
    if: ${{ !cancelled() }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      TTY: ${{ needs.scope.outputs.tty }}
      TTY_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps: *tty-steps

  # Four hosted legs: the three parts of the repository-wide suite, and the
  # release unit with the Windows script suites. Each step reads its leg's
  # flag, as in `gates-linux`. Like the hosted macOS legs they run unless the
  # plan sent the gates to the Windows pool and a VM took them (§6).
  windows-gates:
    name: Gates (Windows) / ${{ matrix.leg }}
    # 45 minutes: same reasoning as `gates-linux`; the hosted Windows runner
    # has 4 cores and a cold Zig cache compiles the whole tree.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: units
            units: true
          - leg: integration
            integration: true
          - leg: product
            product: true
          - leg: release
            release: true
    runs-on: windows-latest
    needs: [release-fast-path, scope, runner-plan, windows-gates-watch]
    # A failed decision leaves FAST_PATH and SUITES empty: run in full rather
    # than skip.
    if: ${{ !cancelled() && (needs.runner-plan.outputs.windows_mode != 'self-hosted' || needs.windows-gates-watch.outputs.fallback == 'true') }}
    env:
      FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      # 'false' only for a documentation-only change; the version state gate
      # and the documentation checks of `gates-linux` cover it, so nothing runs
      # here.
      SUITES: ${{ needs.scope.outputs.suites }}
      UNITS: ${{ needs.scope.outputs.units }}
      PRODUCT: ${{ needs.scope.outputs.product }}
      OFFLINE_EVAL: ${{ needs.scope.outputs.offline_eval }}
      PACKAGE_TESTS: ${{ needs.scope.outputs.package_tests }}
      # As in `gates-linux`.
      ZIG_BUILD_JOBS: "8"
    steps: &windows-gates-steps
      - name: Release fast path
        env:
          REASON: ${{ needs.release-fast-path.outputs.reason }}
        run: echo "$REASON"
      - name: Change scope
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: echo "$REASON"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          # Same as `gates-linux`: the repository-snapshot and grounding
          # fingerprint tests resolve historical commits with `git rev-parse`,
          # which a depth-1 checkout cannot (5 errors on the first full run).
          fetch-depth: 0
      # The Windows pool job only, as in `gates-linux`: it sets FAST_PATH.
      - name: Stand down if the hosted legs took over
        if: env.POOL_JOB == 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts\ci_pool_plan.py stand-down --platform windows --github-env "%GITHUB_ENV%"
      # See `gates-linux` for the caches.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        with:
          version: 0.16.0
          use-cache: false
      - name: Restore the Zig cache main saved
        if: env.WARM_CACHE != 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-
          restore-keys: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-
      # The hosted Windows image checks out with core.autocrlf=true, and
      # .gitattributes (`* text=auto eol=lf`) is the contract: @embedFile'd
      # templates and pinned fixtures hash by the byte. List what is wrong for
      # the record, rewrite the tree from the index under .gitattributes, and
      # fail closed if anything still carries CRLF. cmd throughout the job:
      # Git-Bash $HOME would be a POSIX-style path that native zig.exe cannot
      # use.
      - name: Normalize line endings of the checkout
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          git config --show-origin --get-all core.autocrlf & echo (core.autocrlf origins above, if any)
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files before normalization above, if any)
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      # As in `gates-linux`: the source-level guards first, on every leg.
      - name: Source-level guards
        if: (matrix.units || matrix.integration || matrix.product || matrix.release) && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build gate:static
      # PyYAML for the Python suites that `zig build test` runs; see
      # `gates-linux`.
      - name: Install Python development dependencies
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m pip install -r requirements-dev.txt
      # As in `gates-linux`: the platform root, standalone, spawn tests on. On
      # the product leg here, the shortest suite leg on Windows, where this
      # step takes about two minutes.
      - name: Native platform modules
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PACKAGE_TESTS == ''
        shell: cmd
        env:
          METACODES_PROC_TEST: "1"
        run: zig test src/platform/platform.zig -lc
      # Current labels and the merge queue's head PR, as in `gates-linux`;
      # bash for the same script.
      - name: Version state gate and release rehearsal
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # A request that gets no answer (a network blip on a self-hosted
          # runner) or a 5xx is tried 3 times; an HTTP 4xx answer fails at once.
          gh_api() {
            local delay out err
            err=$(mktemp)
            for delay in 10 30 ""; do
              if out=$(gh api "$@" 2>"$err"); then
                rm -f "$err"
                printf '%s\n' "$out"
                return 0
              fi
              cat "$err" >&2
              if [ -z "$delay" ] || grep -q 'HTTP 4[0-9][0-9]' "$err"; then
                rm -f "$err"
                return 1
              fi
              echo "gh api $1 failed; retrying in ${delay}s" >&2
              sleep "$delay"
            done
          }
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            if [[ ! "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]+$ ]]; then
              echo "not a merge queue ref: $MERGE_GROUP_HEAD_REF" >&2
              exit 1
            fi
            RELEASE_PR_NUMBER=${BASH_REMATCH[1]}
            GITHUB_HEAD_REF=$(gh_api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)
            RELEASE_PR_TITLE=$(gh_api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .title)
            export GITHUB_HEAD_REF RELEASE_PR_TITLE
          fi
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            RELEASE_PR_LABELS=$(gh_api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR_NUMBER/labels" --jq '[.[].name] | join(",")')
            export RELEASE_PR_LABELS
          fi
          python scripts/check_version_state.py --rehearse
      - name: Verify native bundle and fresh-store contract
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      # The Windows release unit ships both Lean kernels too (manifest v2), and
      # the suite builds them, so both legs provision the same pinned elan and
      # Lean cache as `gates-linux`; the kernel scripts run under Git Bash
      # (kernels:stage invokes bash).
      - name: Restore Lean toolchain and build products
        id: lean
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned elan
        if: env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: bash
        run: bash scripts/ci/install-elan.sh
      - name: Stage Lean kernels for the release layout
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          zig build kernels:stage -Dlean-kernels=on --prefix "%RUNNER_TEMP%\release-prefix" || exit /b 1
          for /f "delims=" %%P in ('python scripts\kernel_pins.py "%RUNNER_TEMP%\release-prefix"') do echo KERNEL_PINS=%%P>> "%GITHUB_ENV%"
          findstr /B KERNEL_PINS= "%GITHUB_ENV%" || exit /b 1
      - name: Default install prefix
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build --prefix "%RUNNER_TEMP%\install-prefix" && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\install-prefix" --doctor
      - name: Release layout prefix
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build release:verify -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\release-prefix" --release --doctor
      - name: Install the release unit with scripts/install.ps1
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 "%RUNNER_TEMP%\release-prefix" -Prefix "%RUNNER_TEMP%\installed" -NoPath && "%RUNNER_TEMP%\installed\bin\metacodes.exe" doctor --strict
      - name: Release bundle verifier self-test
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python scripts\verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-1" && zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-2" && python scripts\release_sums.py --self-test && for %%F in ("%RUNNER_TEMP%\dist-1\metacodes-*.zip") do fc /b "%%F" "%RUNNER_TEMP%\dist-2\%%~nxF" > nul && zig build release:sums -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" %KERNEL_PINS% -Drelease-archive-dir="%RUNNER_TEMP%\dist-1"
      - name: Verify install prefix unit tests
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Install script unit tests
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_install_scripts -v
      - name: Kernel provenance verifier unit tests
        if: matrix.release && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_kernel_provenance -v
      # The repository-wide suite on the native Windows host (#53), as its
      # three parts, one per leg: the integration suite waits five minutes for
      # the ReleaseSmall app here, so it gets a runner of its own. Each part
      # builds both kernels itself (-Dlean-kernels=on). No METACODES_TEST_REQUIRE_LEAN_SDK here: the
      # Python Lean-SDK suites stay POSIX-only (scripts/eval/tests/
      # posix_only.py), and the component tests that drive a kernel through
      # POSIX-only paths skip on Windows as before. --test-timeout 5m: the
      # build runner watchdog between tests is max(--test-timeout, 60s), same
      # as the AgentCore gate. --summary all: see `gates-linux`.
      - name: Offline test suite (units)
        if: matrix.units && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.UNITS != 'false' && env.PACKAGE_TESTS == ''
        shell: cmd
        run: zig build test:units -j%ZIG_BUILD_JOBS% --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (affected packages)
        if: matrix.units && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.UNITS != 'false' && env.PACKAGE_TESTS != ''
        shell: cmd
        run: zig build %PACKAGE_TESTS% -j%ZIG_BUILD_JOBS% --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (integration)
        if: matrix.integration && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.UNITS != 'false'
        shell: cmd
        run: zig build test:integration -j%ZIG_BUILD_JOBS% --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (product)
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PRODUCT != 'false' && env.OFFLINE_EVAL != 'false'
        shell: cmd
        run: zig build test:product -j%ZIG_BUILD_JOBS% --test-timeout 5m -Dlean-kernels=on --summary all
      - name: Offline test suite (product runtime)
        if: matrix.product && env.FAST_PATH != 'true' && env.SUITES != 'false' && env.PRODUCT != 'false' && env.OFFLINE_EVAL == 'false'
        shell: cmd
        run: zig build test:product-runtime -j%ZIG_BUILD_JOBS% --test-timeout 5m -Dlean-kernels=on --summary all
      # Evidence for the next line-ending incident: if the suite itself rewrites
      # tracked files with CRLF, this lists them; the step never fails.
      - name: Line endings after the suite
        if: always() && (matrix.units || matrix.integration || matrix.product) && env.FAST_PATH != 'true' && env.SUITES != 'false'
        shell: cmd
        run: |
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files after the suite above, if any)
          exit /b 0
      # As in `gates-linux`: main's warm run saves, pull requests never do. The
      # suite builds the Lean kernels here, so the Lean products are saved
      # after it.
      - name: Save Lean toolchain and build products
        if: env.WARM_CACHE == 'true' && matrix.units && steps.lean.outputs.cache-hit != 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: ${{ steps.lean.outputs.cache-primary-key }}
      - name: Save the Zig cache for pull requests
        if: env.WARM_CACHE == 'true' && env.FAST_PATH != 'true' && env.SUITES != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-gates-${{ matrix.leg }}-run-${{ github.run_id }}-${{ github.run_attempt }}

  # The Windows gates as one job on a self-hosted runner, switched off until
  # AIPC has one (doc/CI_DESIGN.md §6), as `gates-macos-vm` is for macOS: the hosted legs'
  # steps with every flag set. FAST_PATH is left to the stand-down step.
  windows-gates-vm:
    name: Gates (Windows) / ${{ matrix.leg }}
    needs: [release-fast-path, scope, runner-plan]
    if: ${{ !cancelled() && (needs.runner-plan.outputs.windows_mode == 'self-hosted' || needs.runner-plan.outputs.windows_mode == 'both') }}
    timeout-minutes: ${{ fromJSON(needs.runner-plan.outputs.windows_timeout_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: all
            units: true
            integration: true
            product: true
            release: true
    runs-on: ${{ needs.runner-plan.outputs.windows_label }}
    env:
      POOL_JOB: "true"
      RELEASE_FAST_PATH: ${{ needs.release-fast-path.outputs.fast }}
      SUITES: ${{ needs.scope.outputs.suites }}
      UNITS: ${{ needs.scope.outputs.units }}
      PRODUCT: ${{ needs.scope.outputs.product }}
      OFFLINE_EVAL: ${{ needs.scope.outputs.offline_eval }}
      PACKAGE_TESTS: ${{ needs.scope.outputs.package_tests }}
      # .github/runner-pools.json, sized to the runner.
      ZIG_BUILD_JOBS: ${{ needs.runner-plan.outputs.windows_zig_build_jobs }}
    steps: *windows-gates-steps

  # As `gates-macos-watch`, for the Windows pool job.
  windows-gates-watch:
    name: Windows pool watch
    needs: [runner-plan]
    if: ${{ !cancelled() && (needs.runner-plan.outputs.windows_mode == 'self-hosted' || needs.runner-plan.outputs.windows_mode == 'both') }}
    timeout-minutes: 135
    runs-on: ubuntu-latest
    outputs:
      fallback: ${{ steps.watch.outputs.fallback }}
      vm_result: ${{ steps.watch.outputs.vm_result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Wait for a VM to take the pool job
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          PICKUP_TIMEOUT_MINUTES: ${{ needs.runner-plan.outputs.windows_pickup_timeout_minutes }}
        run: python3 scripts/ci_pool_plan.py watch --platform windows --pickup-timeout-minutes "$PICKUP_TIMEOUT_MINUTES" --github-output "$GITHUB_OUTPUT"

  # The checks the `Protect main` ruleset requires: Gates (Linux), Gates
  # (macOS), Gates (Windows) and TTY (Linux) (doc/CI_DESIGN.md §1, §4). Each
  # waits for its platform's legs or shards and passes only if every one of
  # them succeeded. `always()`, not `!cancelled()`: a result job must never
  # report skipped, which a required check counts as passing, so on a
  # cancelled run it runs and fails. TTY (Windows) is not required; it reports
  # the same way so that it can become required.
  gates-linux-result:
    name: Gates (Linux)
    needs: [gates-linux, test-ids]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed, and the test ID comparison where it ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e '.["gates-linux"].result == "success" and (.["test-ids"].result == "success" or .["test-ids"].result == "skipped")' > /dev/null

  # Gates (macOS) and Gates (Windows) pass when the gates passed where they
  # ran: the pool job (through the watch), or the hosted legs
  # (scripts/ci_pool_plan.py verdict). Neither needs its pool job.
  gates-macos-result:
    name: Gates (macOS)
    needs: [runner-plan, gates-macos-watch, gates-macos]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The gates passed where they ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_pool_plan.py verdict --platform macos

  gates-windows-result:
    name: Gates (Windows)
    needs: [runner-plan, windows-gates-watch, windows-gates]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The gates passed where they ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_pool_plan.py verdict --platform windows

  tty-linux-result:
    name: TTY (Linux)
    needs: tty-linux
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps: &result-steps
      - name: Every leg passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

  tty-windows-result:
    name: TTY (Windows)
    needs: tty-windows
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps: *result-steps

  migration-baseline:
    name: Locate migration baseline
    needs: [release-fast-path, scope]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'migration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.find.outputs.mode }}
      base: ${{ steps.find.outputs.base }}
      tree: ${{ steps.find.outputs.tree }}
      merge: ${{ steps.find.outputs.merge }}
      head_tree: ${{ steps.find.outputs.head_tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ needs.scope.outputs.scope }}
          COMPLETE: ${{ needs.scope.outputs.complete }}
          FAST: ${{ needs.release-fast-path.outputs.fast }}
        run: python3 scripts/test_id_baseline.py plan --scope "$SCOPE" --complete "$COMPLETE" --fast "$FAST" --directory "$RUNNER_TEMP/migration-base"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.find.outputs.mode == 'cache'
        with:
          name: migration-base
          path: ${{ runner.temp }}/migration-base
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  migration-replay:
    name: Migration baseline (Linux) / ${{ matrix.leg }}
    needs: migration-baseline
    if: needs.migration-baseline.outputs.mode == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        leg: [units, product, checks]
    env:
      BASE_SHA: ${{ needs.migration-baseline.outputs.base }}
      BASE_TREE: ${{ needs.migration-baseline.outputs.tree }}
      LEG: ${{ matrix.leg }}
      COMPLETE: 'true'
      ZIG_BUILD_JOBS: '8'
      WARM_CACHE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned base's Linux leg
        run: |
          cp scripts/test_id_replay.py "$RUNNER_TEMP/"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          /usr/bin/python3 "$RUNNER_TEMP/test_id_replay.py" "$LEG" .git/test-id-replay
      - uses: ./.git/test-id-replay
      - name: Record baseline revision
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          jq -nc --arg sha "$BASE_SHA" --arg tree "$BASE_TREE" --arg leg "$LEG" '[$sha,$tree,$leg]' > "$RUNNER_TEMP/test-ids/revision.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-raw-${{ matrix.leg }}
          path: ${{ runner.temp }}/test-ids
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  test-ids:
    name: Test IDs (Linux)
    needs: [release-fast-path, scope, gates-linux, migration-baseline, migration-replay]
    if: ${{ !cancelled() && needs.gates-linux.result == 'success' && ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'migration')) || (needs.release-fast-path.outputs.fast != 'true' && needs.scope.outputs.suites != 'false')) }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      # A narrowed scope records no IDs (the gate legs' Record step).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.scope.outputs.complete != 'false'
        with:
          pattern: test-ids-raw-*
          path: ${{ runner.temp }}/test-ids-raw
      - name: Collect the executed test IDs
        if: needs.scope.outputs.complete != 'false'
        run: python3 scripts/test_ids.py collect --raw "$RUNNER_TEMP/test-ids-raw" --tty tests/tty/cases --output "$RUNNER_TEMP/test-ids/test-ids.tsv" --meta "$RUNNER_TEMP/test-ids/test-ids-meta.json"
      - name: Verify all full-scope Linux test ID sources
        if: needs.scope.outputs.scope == 'full' && needs.scope.outputs.complete == 'true'
        run: python3 scripts/test_id_baseline.py attest --directory "$RUNNER_TEMP/test-ids" --raw "$RUNNER_TEMP/test-ids-raw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.scope.outputs.complete != 'false'
        with:
          name: test-ids
          path: ${{ runner.temp }}/test-ids
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Compare with the base's test IDs
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'migration')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMPLETE: ${{ needs.scope.outputs.complete }}
        run: python3 scripts/test_ids.py ci-compare --head "$RUNNER_TEMP/test-ids/test-ids.tsv" --base HEAD^1 --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --summary "$GITHUB_STEP_SUMMARY" --scope-complete "$COMPLETE" --require-unlabelled

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.migration-baseline.outputs.mode == 'cache'
        with:
          name: migration-base
          path: ${{ runner.temp }}/migration-base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.migration-baseline.outputs.mode == 'replay' && needs.migration-replay.result == 'success'
        with:
          pattern: migration-raw-*
          path: ${{ runner.temp }}/migration-raw
      - name: Enforce the pinned migration comparison
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'migration')
        env:
          PLAN_RESULT: ${{ needs.migration-baseline.result }}
          MODE: ${{ needs.migration-baseline.outputs.mode }}
          PIN_BASE: ${{ needs.migration-baseline.outputs.base }}
          PIN_TREE: ${{ needs.migration-baseline.outputs.tree }}
          PIN_MERGE: ${{ needs.migration-baseline.outputs.merge }}
          PIN_HEAD_TREE: ${{ needs.migration-baseline.outputs.head_tree }}
          REPLAY_RESULT: ${{ needs.migration-replay.result }}
          SCOPE: ${{ needs.scope.outputs.scope }}
          COMPLETE: ${{ needs.scope.outputs.complete }}
        run: |
          test "$PLAN_RESULT" = success
          python3 scripts/test_id_baseline.py compare --mode "$MODE" --scope "$SCOPE" --complete "$COMPLETE" --directory "$RUNNER_TEMP/migration-base" --raw "$RUNNER_TEMP/migration-raw" --head "$RUNNER_TEMP/test-ids/test-ids.tsv"

  full-pr-evidence:
    name: Full PR evidence
    # macOS and Windows through their result jobs: the pool job or the hosted
    # legs, wherever the gates ran (§6).
    needs: [release-fast-path, scope, gates-linux-result, gates-macos-result, gates-windows-result, tty-linux, tty-windows, sdk-bindings]
    if: ${{ always() && github.event_name == 'pull_request' && needs.scope.outputs.scope == 'full' && needs.release-fast-path.outputs.fast == 'false' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every full-suite job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'length == 8 and all(.[]; .result == "success")' > /dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Record the tested merge tree
        run: python3 scripts/ci_evidence.py --output "$RUNNER_TEMP/pr-ci-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-ci-evidence
          path: ${{ runner.temp }}/pr-ci-evidence.json
          if-no-files-found: error
          retention-days: 90

  # main's nightly run, which is a full run on every platform, also lists the
  # commits merged in the day before it and the scope each one's pull request
  # ran, as its CI run recorded it (the scope job's change-scope artifact;
  # `unknown` without one). When the full run fails and the day's pull
  # requests ran narrowed scopes, the list names the candidates that skipped
  # the failing suite (doc/CI_DESIGN.md §2).
  merged-scopes:
    name: Scopes of the day's merges
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Report the change scope of the day's merges
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py merged --since "24 hours ago" --repository "$GITHUB_REPOSITORY"
