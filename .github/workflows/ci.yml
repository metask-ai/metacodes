name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig and contract tests (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: X64
          - os: macOS
            arch: ARM64
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Zig format check
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src tests
      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      - name: TinyKG binary-contract unit tests
        run: python3 -m unittest scripts.tests.test_stage_tinykg_binary -v
      - name: Full offline test suite
        run: zig build test
      - name: ReleaseSafe core gate
        if: runner.os == 'Linux'
        run: zig build test:lib -Doptimize=ReleaseSafe
      - name: Repository coverage audit
        if: runner.os == 'Linux'
        run: scripts/test_coverage_audit.sh

  platform-runtime:
    name: platform runtime (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: X64
          - os: macOS
            arch: ARM64
          - os: Windows
            arch: X64
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Native platform modules
        if: runner.os != 'Windows'
        shell: bash
        env:
          METACODES_PROC_TEST: "1"
        run: |
          set -euo pipefail
          for module in sync fs rng paths signal process net dir; do
            zig test "src/platform/${module}.zig" -lc
          done
      - name: Native platform modules (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          METACODES_PROC_TEST: "1"
        run: >-
          zig test src/platform/sync.zig -lc &&
          zig test src/platform/fs.zig -lc &&
          zig test src/platform/rng.zig -lc &&
          zig test src/platform/paths.zig -lc &&
          zig test src/platform/signal.zig -lc &&
          zig test src/platform/process.zig -lc &&
          zig test src/platform/net.zig -lc &&
          zig test src/platform/dir.zig -lc

  tinykg-bundle:
    name: bundled TinyKG (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: X64
          - os: macOS
            arch: ARM64
          - os: Windows
            arch: X64
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify native bundle and fresh-store contract
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python scripts/verify_tinykg_binary.py
          zig build tinykg:stage
      - name: Verify native bundle and fresh-store contract (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && zig build tinykg:stage
      - name: Verify Linux arm64 cross-stage contract
        if: runner.os == 'Linux'
        run: zig build tinykg:stage -Dtarget=aarch64-linux-musl
