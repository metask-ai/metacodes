name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Topology: one job per platform on GitHub-hosted runners (the repository is
# public; organization policy keeps public repositories off the self-hosted
# fleet, and hosted standard runners are free for public repositories).
# Cross-platform parallelism comes from the matrix; intra-platform steps run
# cheapest-first for fail-fast. Every runner is ephemeral: nothing persists
# between runs except what actions/cache and setup-zig restore explicitly.
jobs:
  gates:
    name: Gates (${{ matrix.os }})
    # This job's steps are a superset of the AGENTS.md "Before submitting"
    # checklist; scripts/tests/test_gate_manifest.py asserts that every checklist
    # command has a step here, so the two cannot drift apart silently.
    # 45 minutes: a cold hosted runner compiles the whole tree and the Lean
    # kernel; warm runs (setup-zig + Lean cache hits) are far shorter.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # use-cache: setup-zig points both Zig cache env vars at one directory
      # and restores/saves it through actions/cache keyed by OS and Zig
      # version. Zig's cache is content-addressed and folds the compiler
      # version into every hash, so a restored directory is always safe; test
      # execution is not affected because test Run steps are has_side_effects
      # in build.zig. cache-size-limit: the directory is dropped instead of
      # saved once it exceeds this many MiB (the default 2 GiB is below what
      # one full run of these gates produces).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      - name: Zig format check
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src tests
      # Lean toolchain and build products. Key: the pinned toolchain plus every
      # Lean source, so a source change rebuilds from the previous products
      # (restore-keys) and Lake hash-verifies what it restores; a stale or
      # torn copy self-heals into a rebuild rather than wrong results.
      - name: Restore Lean toolchain and build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            control-plane/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control-plane/lean/lean-toolchain', 'control-plane/lean/lakefile.toml', 'control-plane/lean/lake-manifest.json', 'control-plane/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-
      # scripts/ci/install-elan.sh: a pinned elan release asset with a pinned
      # SHA-256, never the mutable elan-init.sh from elan's master branch (the
      # reason lean-action was dropped). A no-op on a cache hit. The toolchain
      # named in control-plane/lean/lean-toolchain installs on first use
      # through elan's own resolver into ~/.elan, which the cache above
      # persists.
      - name: Install pinned elan
        run: bash scripts/ci/install-elan.sh
      - name: Build pinned Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          (cd control-plane/lean && lake build)
          # The project-harness kernel is linked and smoked by its build
          # script, not by `lake build`: the smoke requests are hand-written
          # canonical JSON that the strict Lean parser must accept field for
          # field, and nothing else exercises that pairing. They drifted from
          # the kernel for three weeks (within_root, 33cf238) because no job
          # ran the script on any platform. The output goes outside the
          # workspace so no test can pick up a kernel that the suite did not
          # stage itself. One line: test_gate_manifest.py shlex-splits every
          # line of this block on its own.
          LAKE="$(command -v lake)" bash scripts/build-project-harness-kernel.sh "$RUNNER_TEMP/metacodes-project-kernel"
      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      # PyYAML for scripts/eval/workbuddy and its tests (requirements-dev.txt).
      # --break-system-packages: the hosted images' system Python is PEP 668
      # "externally managed"; the runner is ephemeral so there is nothing to
      # protect.
      - name: Install Python development dependencies
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      # A version without -dev is legal only on its tagged commit, the release
      # PR, or main's run of the release merge commit; in the latter two the
      # gate tags HEAD locally so the release-layout steps below can run the
      # stable channel on the candidate (doc/RELEASE_AUTOMATION_DESIGN.md §3).
      - name: Version state gate and release rehearsal
        run: python3 scripts/check_version_state.py --rehearse
      - name: TinyKG binary-contract unit tests
        run: python3 -m unittest scripts.tests.test_stage_tinykg_binary -v
      - name: ripgrep binary-contract unit tests
        run: python3 -m unittest scripts.tests.test_stage_ripgrep_binary -v
      - name: Trajectory audit unit tests
        run: python3 -m unittest scripts.tests.test_audit_trajectories -v
      - name: Verify native bundle and fresh-store contract
        shell: bash
        run: |
          python3 scripts/verify_tinykg_binary.py
          python3 scripts/verify_ripgrep_binary.py
          zig build tinykg:stage
      # Both vendored runtime assets stage for aarch64-linux, and the static
      # release checks accept the cross-built unit (#86): the target's rg is
      # the upstream aarch64 musl binary, first published with ripgrep 15.x.
      - name: Verify Linux arm64 cross-stage contract
        if: runner.os == 'Linux'
        run: |
          zig build tinykg:stage -Dtarget=aarch64-linux-musl
          zig build release:check -Dtarget=aarch64-linux-musl -Drelease-layout=true --prefix "$RUNNER_TEMP/release-aarch64-linux"
      - name: Native platform modules
        shell: bash
        env:
          METACODES_PROC_TEST: "1"
        run: |
          set -euo pipefail
          for module in sync fs rng paths signal process net dir exe_lookup; do
            zig test "src/platform/${module}.zig" -lc
          done
      - name: Full offline test suite
        env:
          # Both legs build control-plane/lean above, so a missing/mislocated
          # ProjectRule.olean is a regression, not an environment gap: fail
          # instead of skip.
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        # --test-timeout 5m: the build runner watchdog between tests is
        # max(--test-timeout, 60s); same value as the Windows leg and the
        # AgentCore gate, so a wedged test on a loaded runner is reported
        # instead of eating the job timeout.
        run: zig build test --test-timeout 5m
      - name: ReleaseSafe core gate
        if: runner.os == 'Linux'
        run: zig build test:lib -Doptimize=ReleaseSafe
      - name: Repository coverage audit
        if: runner.os == 'Linux'
        run: scripts/test_coverage_audit.sh
      - name: Documentation link check
        if: runner.os == 'Linux'
        run: python3 scripts/check_doc_links.py
      - name: Default install prefix
        run: zig build --prefix "$RUNNER_TEMP/install-prefix" && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/install-prefix" --doctor
      # The sidecar the kernel build script wrote, read by the installed
      # product's own loader: the pairing no unit test can cover (the project
      # kernel's v6 sidecar was validated with the formal v4 loader for as long
      # as nothing ran a real one through doctor, 2026-09-21).
      - name: Built project kernel provenance is accepted by doctor
        run: python3 scripts/verify_kernel_provenance.py "$RUNNER_TEMP/install-prefix/bin/metacodes" --project "$RUNNER_TEMP/metacodes-project-kernel"
      - name: Release layout prefix
        run: zig build release:verify -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" && python3 scripts/verify_install_prefix.py "$RUNNER_TEMP/release-prefix" --release --doctor
      - name: Release bundle verifier self-test
        run: python3 scripts/verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        run: |
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          zig build release:archive -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" -Drelease-archive-dir="$RUNNER_TEMP/dist-2"
          cmp "$RUNNER_TEMP"/dist-1/metacodes-*.tar.gz "$RUNNER_TEMP"/dist-2/metacodes-*.tar.gz
          zig build release:sums -Drelease-layout=true --prefix "$RUNNER_TEMP/release-prefix" -Drelease-archive-dir="$RUNNER_TEMP/dist-1"
          cat "$RUNNER_TEMP"/dist-1/metacodes-*-SHA256SUMS
      - name: Third-party notices check
        if: runner.os == 'Linux'
        run: python3 scripts/gen_third_party_notices.py --check
      - name: Documentation fact check
        if: runner.os == 'Linux'
        run: python3 scripts/check_doc_facts.py
      - name: Documentation fact-check unit tests
        run: python3 -m unittest scripts.tests.test_check_doc_facts -v
      - name: Third-party notices unit tests
        run: python3 -m unittest scripts.tests.test_gen_third_party_notices -v
      - name: Gate manifest unit tests
        run: python3 -m unittest scripts.tests.test_gate_manifest -v
      - name: Verify install prefix unit tests
        run: python3 -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Kernel provenance verifier unit tests
        run: python3 -m unittest scripts.tests.test_verify_kernel_provenance -v
      - name: Python floor unit tests
        run: python3 -m unittest scripts.tests.test_python_floor -v
      - name: Release cut unit tests
        run: python3 -m unittest scripts.tests.test_release_cut -v
      - name: Diff whitespace check
        run: git diff --check

  windows-gates:
    name: Gates (Windows)
    # 45 minutes: same reasoning as the `gates` job; the hosted Windows runner
    # has 4 cores and a cold Zig cache compiles the whole tree.
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same as the `gates` job: the repository-snapshot and grounding
          # fingerprint tests resolve historical commits with `git rev-parse`,
          # which a depth-1 checkout cannot (5 errors on the first full run).
          fetch-depth: 0
      # See the `gates` job for the cache semantics.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true
          cache-size-limit: 4096
      # The hosted Windows image checks out with core.autocrlf=true, and
      # .gitattributes (`* text=auto eol=lf`) is the contract: @embedFile'd
      # templates and pinned fixtures hash by the byte. List what is wrong for
      # the record, rewrite the tree from the index under .gitattributes, and
      # fail closed if anything still carries CRLF. cmd throughout the job:
      # Git-Bash $HOME would be a POSIX-style path that native zig.exe cannot
      # use.
      - name: Normalize line endings of the checkout
        shell: cmd
        run: |
          git config --show-origin --get-all core.autocrlf & echo (core.autocrlf origins above, if any)
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files before normalization above, if any)
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      # PyYAML for the Python suites that `zig build test` runs; see the
      # `gates` job.
      - name: Install Python development dependencies
        shell: cmd
        run: python -m pip install -r requirements-dev.txt
      - name: Native platform modules
        shell: cmd
        env:
          METACODES_PROC_TEST: "1"
        run: >-
          zig test src/platform/sync.zig -lc &&
          zig test src/platform/fs.zig -lc &&
          zig test src/platform/rng.zig -lc &&
          zig test src/platform/paths.zig -lc &&
          zig test src/platform/signal.zig -lc &&
          zig test src/platform/process.zig -lc &&
          zig test src/platform/net.zig -lc &&
          zig test src/platform/dir.zig -lc &&
          zig test src/platform/exe_lookup.zig -lc
      - name: Version state gate and release rehearsal
        shell: cmd
        run: python scripts\check_version_state.py --rehearse
      - name: Verify native bundle and fresh-store contract
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      - name: Default install prefix
        shell: cmd
        run: zig build --prefix "%RUNNER_TEMP%\install-prefix" && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\install-prefix" --doctor
      - name: Release layout prefix
        shell: cmd
        run: zig build release:verify -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" && python scripts\verify_install_prefix.py "%RUNNER_TEMP%\release-prefix" --release --doctor
      - name: Release bundle verifier self-test
        shell: cmd
        run: python scripts\verify_release_bundle.py --self-test
      - name: Release archive is reproducible
        shell: cmd
        run: zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" -Drelease-archive-dir="%RUNNER_TEMP%\dist-1" && zig build release:archive -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" -Drelease-archive-dir="%RUNNER_TEMP%\dist-2" && python scripts\release_sums.py --self-test && for %%F in ("%RUNNER_TEMP%\dist-1\metacodes-*.zip") do fc /b "%%F" "%RUNNER_TEMP%\dist-2\%%~nxF" > nul && zig build release:sums -Drelease-layout=true --prefix "%RUNNER_TEMP%\release-prefix" -Drelease-archive-dir="%RUNNER_TEMP%\dist-1"
      - name: Verify install prefix unit tests
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_install_prefix -v
      - name: Kernel provenance verifier unit tests
        shell: cmd
        run: python -m unittest scripts.tests.test_verify_kernel_provenance -v
      # The repository-wide suite on the native Windows host (#53). No Lean
      # step and no METACODES_TEST_REQUIRE_LEAN_SDK here: the kernel-gated
      # tests take their checker from operator-provided
      # METACODES_TEST_*_KERNEL_* variables that no job sets, and this leg does
      # not provision elan; they skip exactly as documented in
      # scripts/eval/tests/posix_only.py and the component tests.
      # --test-timeout 5m: the build runner watchdog between tests is
      # max(--test-timeout, 60s), same as the AgentCore gate.
      - name: Full offline test suite
        shell: cmd
        run: zig build test --test-timeout 5m
      # Evidence for the next line-ending incident: if the suite itself rewrites
      # tracked files with CRLF, this lists them; the step never fails.
      - name: Line endings after the suite
        if: always()
        shell: cmd
        run: |
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files after the suite above, if any)
          exit /b 0
