name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Topology: one job per platform. The fleet has one runner per platform, so
# splitting a platform's gates across jobs only serializes them behind extra
# checkout/setup overhead and queue gaps (measured: the macOS test job waited
# 5m16s behind its own platform/bundle jobs). Cross-platform parallelism comes
# from the matrix; intra-platform steps run cheapest-first for fail-fast.
jobs:
  gates:
    name: Gates (${{ matrix.os }})
    # This job's steps are a superset of the AGENTS.md "Before submitting"
    # checklist; scripts/tests/test_gate_manifest.py asserts that every checklist
    # command has a step here, so the two cannot drift apart silently.
    timeout-minutes: 30
    # Self-hosted isolation guard: never schedule fork-PR code onto the
    # persistent self-hosted runners. Same-repo PRs, pushes to main, and
    # workflow_dispatch runs are unaffected (github.event.pull_request is
    # null for non-PR events, so the first clause passes them). Remove only
    # when public CI moves to GitHub-hosted or ephemeral runners
    # (OPEN_SOURCE_READINESS.md, "Final launch gate").
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: X64
          - os: macOS
            arch: ARM64
    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    # One physical runner per platform is shared by jobs from different
    # workflows (AgentCore Windows compiles at -j12 while this job runs the
    # full suite; issue #52 suggestion 3). GitHub runs at most one job per
    # concurrency group, so heavy jobs queue behind each other instead of
    # overlapping on the same box, which is the load that made timing-
    # sensitive L2 tests flake (#51/#52). GitHub also cancels an *older*
    # pending job when a newer one joins the group, so pushes to main get
    # their own bucket: a PR push can never cancel a waiting main run.
    # rule-control stays outside these groups on purpose: it is dispatch-
    # only and runs for up to two hours, and that pending-cancel rule would
    # let a PR push cancel a release gate a maintainer is waiting for; its
    # isolation is the dedicated-runner item in ROADMAP M1.
    concurrency:
      group: runner-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      # checkout's default `git clean -ffdx` wipes the workspace .zig-cache
      # that setup-zig points both cache env vars at, so without this every
      # run recompiles the world cold. Zig's cache is content-addressed,
      # folds the compiler version into every hash, and takes advisory locks,
      # so a shared per-runner directory is safe; test execution is not
      # affected because test Run steps are has_side_effects in build.zig.
      - name: Point Zig caches at persistent per-runner storage
        shell: bash
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/metacodes-zig/global" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/metacodes-zig/local" >> "$GITHUB_ENV"
      - name: Zig format check
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src tests
      # Lean kernel build without lean-action: the action re-ran an unpinned
      # `curl .../elan/master/elan-init.sh | sh` on every run (mutable script
      # executed on a persistent runner, ~40 s, and the reinstall invalidated
      # Lake's toolchain traces so the kernel cold-built each time despite the
      # restored .lake). elan is a presence-checked runner prerequisite like
      # rg; the pinned toolchain in control-plane/lean/lean-toolchain installs
      # once into the persistent ~/.elan via elan's own resolver.
      # control-plane/lean/.lake sits in the workspace and is wiped by the
      # checkout clean; Lake hash-verifies restored products, so a stale or
      # torn copy self-heals into a rebuild rather than wrong results.
      - name: Build pinned Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ] && ! command -v lake >/dev/null 2>&1; then
            echo "elan is a runner prerequisite (see ROADMAP M1); install it once:" >&2
            echo "  https://github.com/leanprover/elan  (or: brew install elan-init)" >&2
            exit 1
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -d "$HOME/.cache/metacodes-lean/lake" ]; then
            mkdir -p control-plane/lean/.lake
            if command -v rsync >/dev/null 2>&1; then
              rsync -a "$HOME/.cache/metacodes-lean/lake/" control-plane/lean/.lake/ || true
            else
              cp -a "$HOME/.cache/metacodes-lean/lake/." control-plane/lean/.lake/ || true
            fi
          fi
          (cd control-plane/lean && lake build)
          mkdir -p "$HOME/.cache/metacodes-lean/lake"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete control-plane/lean/.lake/ "$HOME/.cache/metacodes-lean/lake/"
          else
            rm -rf "$HOME/.cache/metacodes-lean/lake"
            cp -a control-plane/lean/.lake "$HOME/.cache/metacodes-lean/lake"
          fi
      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      - name: TinyKG binary-contract unit tests
        run: python3 -m unittest scripts.tests.test_stage_tinykg_binary -v
      - name: ripgrep binary-contract unit tests
        run: python3 -m unittest scripts.tests.test_stage_ripgrep_binary -v
      - name: Trajectory audit unit tests
        run: python3 -m unittest scripts.tests.test_audit_trajectories -v
      - name: Verify native bundle and fresh-store contract
        shell: bash
        run: |
          python3 scripts/verify_tinykg_binary.py
          python3 scripts/verify_ripgrep_binary.py
          zig build tinykg:stage
      - name: Verify Linux arm64 cross-stage contract
        if: runner.os == 'Linux'
        run: zig build tinykg:stage -Dtarget=aarch64-linux-musl
      - name: Native platform modules
        shell: bash
        env:
          METACODES_PROC_TEST: "1"
        run: |
          set -euo pipefail
          for module in sync fs rng paths signal process net dir exe_lookup; do
            zig test "src/platform/${module}.zig" -lc
          done
      - name: Full offline test suite
        env:
          # Both legs build control-plane/lean above (lean-action, build: true),
          # so a missing/mislocated ProjectRule.olean is a regression, not an
          # environment gap: fail instead of skip.
          METACODES_TEST_REQUIRE_LEAN_SDK: "1"
        # --test-timeout 5m: the build runner watchdog between tests is
        # max(--test-timeout, 60s); same value as the Windows leg and the
        # AgentCore gate, so a wedged test on a loaded runner is reported
        # instead of eating the job timeout.
        run: zig build test --test-timeout 5m
      - name: ReleaseSafe core gate
        if: runner.os == 'Linux'
        run: zig build test:lib -Doptimize=ReleaseSafe
      - name: Repository coverage audit
        if: runner.os == 'Linux'
        run: scripts/test_coverage_audit.sh
      - name: Documentation link check
        if: runner.os == 'Linux'
        run: python3 scripts/check_doc_links.py
      - name: Third-party notices check
        if: runner.os == 'Linux'
        run: python3 scripts/gen_third_party_notices.py --check
      - name: Documentation fact check
        if: runner.os == 'Linux'
        run: python3 scripts/check_doc_facts.py
      - name: Documentation fact-check unit tests
        run: python3 -m unittest scripts.tests.test_check_doc_facts -v
      - name: Third-party notices unit tests
        run: python3 -m unittest scripts.tests.test_gen_third_party_notices -v
      - name: Gate manifest unit tests
        run: python3 -m unittest scripts.tests.test_gate_manifest -v
      - name: Diff whitespace check
        run: git diff --check

  windows-gates:
    name: Gates (Windows)
    # Measured on the self-hosted runner with warm caches: full suite step 1:09,
    # job 1:47. A cold cache compiles the whole tree; 30 matches the `gates` job.
    timeout-minutes: 30
    # Self-hosted isolation guard; see the `gates` job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    # Same runner-serialization group as AgentCore Windows; see the `gates`
    # job for the semantics.
    concurrency:
      group: runner-Windows-X64-${{ github.ref == 'refs/heads/main' && 'main' || 'pr' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same as the `gates` job: the repository-snapshot and grounding
          # fingerprint tests resolve historical commits with `git rev-parse`,
          # which a depth-1 checkout cannot (5 errors on the first full run).
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false
      # See the `gates` job for why; cmd because the Windows runner is not
      # guaranteed to provide bash, and Git-Bash $HOME would be a POSIX-style
      # path that native zig.exe cannot use.
      - name: Point Zig caches at persistent per-runner storage
        shell: cmd
        run: |
          echo ZIG_GLOBAL_CACHE_DIR=%USERPROFILE%\.cache\metacodes-zig\global>>"%GITHUB_ENV%"
          echo ZIG_LOCAL_CACHE_DIR=%USERPROFILE%\.cache\metacodes-zig\local>>"%GITHUB_ENV%"
      # The workspace persists between runs and git treats a CRLF file whose
      # normalized content matches the index as clean, so `checkout --force`
      # never repairs line endings some other process rewrote (run 33768501933
      # failed exactly that way: plugin.json and pinned fixtures hashed as CRLF
      # while the previous run on the same machine had them as LF). List what is
      # wrong for the record, rewrite the tree from the index under
      # .gitattributes, and fail closed if anything still carries CRLF.
      - name: Normalize line endings of the persistent workspace
        shell: cmd
        run: |
          git config --show-origin --get-all core.autocrlf & echo (core.autocrlf origins above, if any)
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files before normalization above, if any)
          git config core.autocrlf false && git rm -q --cached -r . && git reset -q --hard
          git ls-files --eol | findstr /R "w/crlf w/mixed" && exit /b 1
          exit /b 0
      - name: Native platform modules
        shell: cmd
        env:
          METACODES_PROC_TEST: "1"
        run: >-
          zig test src/platform/sync.zig -lc &&
          zig test src/platform/fs.zig -lc &&
          zig test src/platform/rng.zig -lc &&
          zig test src/platform/paths.zig -lc &&
          zig test src/platform/signal.zig -lc &&
          zig test src/platform/process.zig -lc &&
          zig test src/platform/net.zig -lc &&
          zig test src/platform/dir.zig -lc &&
          zig test src/platform/exe_lookup.zig -lc
      - name: Verify native bundle and fresh-store contract
        shell: cmd
        run: python scripts/verify_tinykg_binary.py && python scripts/verify_ripgrep_binary.py && zig build tinykg:stage
      # The repository-wide suite on the native Windows host. Until #53 this was
      # the "independent gate" build.zig talked about that no workflow ran, so
      # Windows portability regressions accumulated silently (1 compile error,
      # 8 unit tests, 8 integration shards, 330 Python cases by the time it was
      # first run). -j6: the default job count is one LLVM codegen per core; on a
      # 28-core/32 GB box that surfaces as bogus "out of memory" compile failures
      # rather than a clean signal, and the runner finishes in ~1 min anyway. --test-timeout 5m: the build runner
      # watchdog between tests is max(--test-timeout, 60s), same as the AgentCore
      # gate. No Lean step and no METACODES_TEST_REQUIRE_LEAN_SDK here: the
      # kernel-gated tests take their checker from operator-provided
      # METACODES_TEST_*_KERNEL_* variables that no job sets, and the runner does
      # not provision elan; they skip on this leg exactly as documented in
      # scripts/eval/tests/posix_only.py and the component tests.
      - name: Full offline test suite
        shell: cmd
        run: zig build test -j6 --test-timeout 5m
      # Evidence for the next line-ending incident: if the suite itself rewrites
      # tracked files with CRLF, this lists them; the step never fails.
      - name: Line endings after the suite
        if: always()
        shell: cmd
        run: |
          git ls-files --eol | findstr /R "w/crlf w/mixed" & echo (CRLF worktree files after the suite above, if any)
          exit /b 0
