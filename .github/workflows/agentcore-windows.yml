name: AgentCore Windows

on:
  pull_request:
  # Inert after the PR-only policy migration; supports landing the migration
  # itself while main still requires a merge queue (doc/CI_DESIGN.md §3).
  merge_group:
  workflow_dispatch:
  # main's nightly run saves the Zig cache pull requests restore, as in
  # ci.yml (doc/CI_DESIGN.md §5).
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

env:
  # As in ci.yml: 'true' only on main's scheduled or dispatched run.
  WARM_CACHE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

jobs:
  native-windows-gate:
    # GitHub-hosted Windows runner (organization policy keeps public
    # repositories off the self-hosted fleet). The image ships rustup with a
    # stable toolchain, which the AgentCore gate's Rust link probe needs.
    # 45 minutes: a cold Zig cache compiles the whole tree in ReleaseSafe on
    # 4 cores; warm runs (setup-zig cache hit) are far shorter.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The job reports on every pull request so that it can be required;
      # the old `on.pull_request.paths`
      # filter left doc-only / evals-only PRs permanently BLOCKED (#134). The
      # expensive steps still run only when a path that can affect the native
      # gate changed; other PRs report success from this step alone. A merge
      # queue group is judged by its whole diff against the group's base.
      - name: Decide whether the change can affect the native gate
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group) base="${{ github.event.merge_group.base_sha }}" ;;
            *) echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git fetch -q --depth=1 origin "$base"
          changed=$(git diff --name-only "$base" HEAD)
          pattern='^build\.zig|^scripts/agentcore_manifest\.zig|^packages/agentcore/.*|^src/core/.*|^src/lsp/.*|^src/lsp_test_root\.zig|^src/platform/.*|^sdk/.*|^tests/component/agentcore_abi_test\.zig|^tests/agentcore_artifact_consumer/.*|^\.github/workflows/agentcore-windows\.yml'
          if grep -Eq "$pattern" <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no native-gate path changed; reporting success without building"
          fi
          printf 'changed files:\n%s\n' "$changed"
      # See ci.yml `gates` for the caches: restored from what main's warm run
      # saved, saved only by that run.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.scope.outputs.relevant == 'true'
        with:
          version: 0.16.0
          use-cache: false
      - name: Restore the Zig cache main saved
        if: env.WARM_CACHE != 'true' && steps.scope.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-agentcore-gate-run-
          restore-keys: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-agentcore-gate-run-
      - name: Build ABI suite once
        run: zig build idle-probe-build sandbox:helper -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe
      - name: Sample natural and overlapping connection schedules
        run: python idle_probe.py
