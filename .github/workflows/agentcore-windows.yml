name: AgentCore Windows

on:
  pull_request:
    paths:
      - "build.zig"
      - "scripts/agentcore_manifest.zig"
      - "scripts/windows_test_prelude.zig"
      - "src/agentcore/**"
      - "src/core/**"
      - "src/platform/**"
      - "sdk/**"
      - "tests/component/agentcore_abi_test.zig"
      - "tests/agentcore_artifact_consumer/**"
      - ".github/workflows/agentcore-windows.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-gate:
    runs-on: [self-hosted, Windows, X64, metask-pc]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Setup Rust toolchain (Windows)
        shell: cmd
        run: |
          where rustup >nul 2>nul
          if errorlevel 1 (
            curl.exe --proto "=https" --tlsv1.2 --retry 10 --retry-connrefused --fail --silent --show-error https://win.rustup.rs/x86_64 -o "%RUNNER_TEMP%\rustup-init.exe"
            if errorlevel 1 exit /b 1
            "%RUNNER_TEMP%\rustup-init.exe" --default-toolchain none --profile minimal --no-modify-path -y
            if errorlevel 1 exit /b 1
          )
          echo %USERPROFILE%\.cargo\bin>>"%GITHUB_PATH%"
          set "PATH=%USERPROFILE%\.cargo\bin;%PATH%"
          rustup toolchain install stable --profile minimal --no-self-update
          if errorlevel 1 exit /b 1
          rustup default stable
          if errorlevel 1 exit /b 1
          rustc --version
          cargo --version
      - name: Native AgentCore delivery gate
        shell: cmd
        run: |
          zig version
          zig build agentcore:gate -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe -j12
      - name: Native Windows platform gate
        shell: cmd
        run: zig build windows:gate -Dtarget=x86_64-windows-gnu -j12
