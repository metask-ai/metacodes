name: Bug report
description: Report a reproducible metacodes defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, prompts, user files, or security vulnerabilities.
  - type: input
    id: revision
    attributes:
      label: Commit or AgentCore bundle revision
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture, and Zig version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
